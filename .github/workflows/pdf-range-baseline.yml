name: PDF Range Baseline Review

on:
  push:
    branches: ['review/pdf-range-baseline']

permissions:
  contents: read

jobs:
  review:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce the malformed-range regression on unchanged production source
        env:
          LEMULIP_RANGE_REVIEW_DIR: ${{ runner.temp }}/lemulip-range-review
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          export LEMULIP_RANGE_REVIEW_COMMIT="$(git rev-parse HEAD)"
          xcrun --sdk macosx swift test --jobs 2 --filter PDFRangeInteractionTests
      - name: Retain actual native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-PDF-Range-Baseline-${{ matrix.arch }}
          path: ${{ runner.temp }}/lemulip-range-review
          if-no-files-found: ignore
          retention-days: 7
