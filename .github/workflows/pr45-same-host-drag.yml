name: PR45 Same Host Drag Diagnostic Kit

on:
  push:
    branches: ['codex/pr45-same-host-drag']
    paths:
      - '.github/workflows/pr45-same-host-drag.yml'
      - 'script/package_same_host_drag.py'
      - 'script/test_package_same_host_drag.py'
      - 'script/native_ui/NativeDragReview.swift'
      - 'script/native_ui/NativeDragSameHost.swift'
      - 'script/native_ui/NativeDragExternalProtocolCheck.swift'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  CANDIDATE_COMMIT: d821d7343675e2850705d141ef9b3b93a6aee945
  CANDIDATE_TREE: 425baa28f00ec24551dd70c0cc874a75fa3be0c1

concurrency:
  group: pr45-same-host-drag-${{ github.ref }}
  cancel-in-progress: true

# Builds only an isolated diagnostic kit. Neither its package checks nor its
# execution receipts replace native acceptance, physical input, or the C12 HOLD.
jobs:
  prepare:
    name: Build And Check Same Host Kit (arm64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check Out Diagnostic Helper And Packaging Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Sources And Preserve Acceptance Gates
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(uname -m)" = arm64
          python3 script/privacy_check.py
          python3 script/test_package_same_host_drag.py
          python3 script/test_prepare_native_ui.py
          python3 script/test_native_release_gate.py
          python3 script/test_sound_review_gate.py

      - name: Check Out Exact C12 Application Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: candidate-source
          persist-credentials: false

      - name: Require Pinned Application Commit And Tree
        working-directory: candidate-source
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Build C12 Application
        working-directory: candidate-source
        env:
          CONFIGURATION: debug
          LEMULIP_ENGINE_PACKS: ''
        run: ./script/build_app.sh

      - name: Stage Unchanged Application And Synthetic Fixtures
        working-directory: candidate-source
        run: >-
          python3 script/prepare_native_ui.py --app dist/Lemulip.app
          --output "$RUNNER_TEMP/lemulip-native-ui"

      - name: Build Native ARM64 Input Helper
        run: >-
          xcrun swiftc -D SAME_HOST_REVIEW -parse-as-library -target arm64-apple-macos13.0
          script/native_ui/NativeDragReview.swift script/native_ui/NativeDragSameHost.swift
          -framework AppKit -framework ApplicationServices -o "$RUNNER_TEMP/LemulipInputCheck"

      - name: Build Separate CI-Only External-Key Protocol Check
        run: >-
          xcrun swiftc -D SAME_HOST_REVIEW -parse-as-library -target arm64-apple-macos13.0
          script/native_ui/NativeDragReview.swift script/native_ui/NativeDragExternalProtocolCheck.swift
          -framework AppKit -framework ApplicationServices -o "$RUNNER_TEMP/NativeDragExternalProtocolCheck"

      - name: Package Isolated Diagnostic Kit
        run: >-
          python3 script/package_same_host_drag.py stage
          --source "$GITHUB_WORKSPACE/candidate-source" --staged "$RUNNER_TEMP/lemulip-native-ui"
          --observer-binary "$RUNNER_TEMP/LemulipInputCheck" --output "$RUNNER_TEMP/same-host-delivery"
          --workflow-commit "$GITHUB_SHA"

      - name: Verify Same ZIP And Input-Free Native Startup
        id: package_verify
        run: >-
          python3 script/package_same_host_drag.py verify
          --source "$GITHUB_WORKSPACE/candidate-source" --output "$RUNNER_TEMP/same-host-delivery"
          --extracted "$RUNNER_TEMP/same-host-extracted"

      - name: Exercise Packaged Automatic Baseline
        id: baseline
        run: |
          helper="$RUNNER_TEMP/same-host-extracted/Lemulip-PR45-Girdi-Karsilastirma-arm64/Lemulip Input Check.app"
          /usr/bin/open -n -W -a "$helper" --args --ci-baseline "$RUNNER_TEMP/same-host-baseline"
          python3 script/package_same_host_drag.py check-observation --mode ci-baseline \
            --report "$RUNNER_TEMP/same-host-baseline/result.json" \
            --payload "$helper/Contents/Resources/Payload/lemulip-native-ui"

      - name: Exercise Physical Escape Timeout Without Injecting Escape
        id: human_timeout
        if: ${{ !cancelled() && steps.package_verify.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          helper="$RUNNER_TEMP/same-host-extracted/Lemulip-PR45-Girdi-Karsilastirma-arm64/Lemulip Input Check.app"
          /usr/bin/open -n -W -a "$helper" --args --ci-human-timeout "$RUNNER_TEMP/same-host-human-timeout"
          python3 script/package_same_host_drag.py check-observation --mode ci-human-timeout \
            --report "$RUNNER_TEMP/same-host-human-timeout/result.json" \
            --payload "$helper/Contents/Resources/Payload/lemulip-native-ui"

      - name: Exercise External-Key Protocol With Explicit CI Stimulus
        if: ${{ !cancelled() && steps.package_verify.outcome == 'success' && steps.human_timeout.outcome == 'success' }}
        run: |
          helper="$RUNNER_TEMP/same-host-extracted/Lemulip-PR45-Girdi-Karsilastirma-arm64/Lemulip Input Check.app"
          "$RUNNER_TEMP/NativeDragExternalProtocolCheck" \
            "$helper/Contents/Resources/Payload/lemulip-native-ui" "$RUNNER_TEMP/same-host-external-protocol"
          python3 - <<'PYCODE'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result = json.loads((root / 'same-host-external-protocol/result.json').read_text())
          expected = {'schema': 1, 'status': 'PASS', 'mode': 'ci-synthetic-external-protocol',
                      'diagnosticOnly': True, 'releaseReady': False, 'physicalInputVerified': False,
                      'testStimulusPosts': 2, 'reportRetained': True}
          case = result.get('case', {})
          escape = case.get('sameHostEscape', {})
          if (any(result.get(k) != v for k, v in expected.items())
                  or escape.get('status') != 'observed-external-pair'
                  or escape.get('syntheticEscapePosts') != 0
                  or case.get('cleanup', {}).get('completed') is not True):
              raise SystemExit('External-key protocol or cleanup was not demonstrated; no physical-input claim.')
          PYCODE

      - name: Require Sealed Package To Remain Unchanged After Execution
        if: ${{ always() && steps.package_verify.outcome == 'success' }}
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, sys
          sys.path.insert(0, 'script')
          from package_same_host_drag import FOLDER, HELPER, PAYLOAD, verify_contents, verify_payload, write_json
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          folder = root / 'same-host-extracted' / FOLDER
          verify_contents(folder)
          verify_payload(folder / HELPER / PAYLOAD)
          write_json(root / 'same-host-delivery/post-execution-integrity.json',
                     {'schema': 1, 'status': 'PASS', 'scope': 'unchanged sealed package only',
                      'diagnosticOnly': True, 'releaseReady': False, 'physicalInputVerified': False})
          PYCODE
          git diff --exit-code HEAD --
          git -C candidate-source diff --exit-code HEAD --

      - name: Retain Verified Kit And Separate Diagnostic Receipts
        if: ${{ always() && steps.package_verify.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: DIAGNOSTIC-PR45-SAME-HOST-arm64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/same-host-delivery/*.zip
            ${{ runner.temp }}/same-host-delivery/*.json
            ${{ runner.temp }}/same-host-delivery/SHA256SUMS.txt
            ${{ runner.temp }}/same-host-baseline/result.json
            ${{ runner.temp }}/same-host-baseline/execution-validation.json
            ${{ runner.temp }}/same-host-human-timeout/result.json
            ${{ runner.temp }}/same-host-human-timeout/execution-validation.json
            ${{ runner.temp }}/same-host-external-protocol/result.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
