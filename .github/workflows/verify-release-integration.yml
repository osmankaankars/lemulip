name: Verify Engine Release Integration
on:
  push:
    branches: [pack/image-engine-20261028]
    paths: [.github/workflows/verify-release-integration.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2f8bfc32b011f2ec24bcfd1ffc3569aa5f491f38
          persist-credentials: false
      - name: Reconstruct bounded reviewed patch from repository objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          api='https://api.github.com/repos/osmankaankars/lemulip/git/'
          def get(route):
              req=urllib.request.Request(api+route,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          chunks={}
          for sha in ['7119fac861354bd4af23949713a724d4ed08a1d7','7fbe43802eb28dab46919a931413959e1d37953d','03967d5f577636f634f4a0e25151e64a0671d797']:
              tree=get('trees/'+sha);assert tree['sha']==sha and not tree.get('truncated')
              for item in tree['tree']:
                  assert item['type']=='blob' and item['mode']=='100644' and item['size']<=2000
                  blob=get('blobs/'+item['sha']);assert blob['encoding']=='base64'
                  text=base64.b64decode(blob['content'])
                  assert hashlib.sha1(b'blob '+str(len(text)).encode()+b'\0'+text).hexdigest()==item['sha']
                  assert item['path'] not in chunks
                  chunks[item['path']]=base64.b64decode(text,validate=True)
          assert set(chunks)=={f'release-{i:02d}' for i in range(12)}
          packed=b''.join(chunks[f'release-{i:02d}'] for i in range(12))
          assert len(packed)==17176 and hashlib.sha256(packed).hexdigest()=='38332a1164c0a63c7aad476ad5713f8406f582767071e131ca8058e519b3b7fa'
          decoder=lzma.LZMADecompressor(memlimit=64*1024*1024)
          patch=decoder.decompress(packed,max_length=59259)
          assert decoder.eof and not decoder.unused_data and len(patch)==59258
          assert hashlib.sha256(patch).hexdigest()=='538a54d41ea9ac044c57da15f56dff911cb3d56530416888eaafd193a0bde924'
          paths=set(''' .github/workflows/build.yml .github/workflows/image-engine-pack.yml README.md Resources/Info.plist Sources/Lemulip/SettingsView.swift Sources/LemulipCore/EngineLocator.swift THIRD_PARTY_NOTICES.md Tests/LemulipCoreTests/EngineHealthTests.swift docs/DEVELOPMENT.md docs/FORMATS.md docs/INSTALL.md docs/RELEASE_NOTES.md docs/USER_GUIDE.md script/build_image_engine.py script/install_ci_build_tools.sh script/merge_engine_packs.py script/package_release.sh script/smoke_bundled_engines.py script/test_build_image_engine.py script/test_release_engines.py script/verify_bundled_engines.py '''.split())
          stats=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {line.split('\t',2)[2] for line in stats.splitlines()}==paths
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='c029fe878b144de3198ea880565410dee977c266'
      - name: Run all portable source and packaging checks
        run: |
          for check in test_site test_branding test_public_images test_engine_packs test_build_media_engine test_build_image_engine test_release_engines; do
            python3 "script/$check.py"
          done
          python3 script/privacy_check.py --staged
          bash -n script/package_release.sh
          bash -n script/install_ci_build_tools.sh
          node --check site/product.js
          node --check site/gallery.js
          git diff --cached --check
      - name: Store byte-verified source objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          entries=[]
          for path in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              raw=pathlib.Path(path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
              assert blob['sha']==expected
              mode=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()[0]
              entries.append({'path':path,'mode':mode,'type':'blob','sha':expected})
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'proof';folder.mkdir()
          (folder/'objects.json').write_text(json.dumps(entries,indent=2)+'\n')
          print(json.dumps(entries))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Release-Integration-Proof
          path: ${{ runner.temp }}/proof/
          retention-days: 7
          if-no-files-found: error
