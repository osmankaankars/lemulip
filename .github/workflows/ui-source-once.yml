name: UI Source Snapshot
on:
  push:
    branches: [design/calm-workspace-20261028]
    paths: [.github/workflows/ui-source-once.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9cfc215a9e05ced2c37d06c8e3de7546bdc9ec95
          persist-credentials: false
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/ui-source.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-UI-Source
          path: ${{ runner.temp }}/ui-source.tar.gz
          retention-days: 1
