name: Published Finder Drag Replay
on:
  push:
    branches: [verify/remaining-checks-20261028]
    paths: [.github/workflows/finder-drag-replay-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1f47dd947fc3da103f2a08d785ddc23688dceb44
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Lemulip-macOS-universal
          run-id: 40622450424
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published
          digest-mismatch: error
      - name: Run the same pinned probe with corrected Swift spacing
        run: |
          python3 - <<'PY'
          import os,pathlib,textwrap
          workflow=pathlib.Path('.github/workflows/finder-drag-once.yml').read_text()
          body=workflow.split('        run: |\n',1)[1].split('      - uses:',1)[0]
          for old,new in [(')==.success',') == .success'),(']=!running','] = !running')]:
              assert body.count(old)==1
              body=body.replace(old,new)
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'run-finder.sh'
          target.write_text(textwrap.dedent(body))
          PY
          bash "$RUNNER_TEMP/run-finder.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Finder-Drag-Review
          path: ${{ runner.temp }}/finder-review/
          if-no-files-found: error
          retention-days: 7
