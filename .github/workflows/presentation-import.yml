name: Apply Reviewed Presentation Patch
on:
  push:
    branches: [fix/compact-gallery-20261021]
    paths: [.github/workflows/presentation-import.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/fix/compact-gallery-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply exact reviewed source changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess, urllib.request
          chunks=[]
          for sha in ['6568246ab4d61e37075aba23759f6198e3e8b5c6','bba01b083f371bddf9284d3a72fa309baa0cfc5f']:
              request=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['encoding']=='base64'
              chunks.append(base64.b64decode(result['content']))
          packed=b''.join(chunks)
          assert len(packed)==15250
          assert hashlib.sha256(packed).hexdigest()=='eb800b19b00d65ed4cf4724e152d4a0fbfe52564db44fe7cfc33613b34afa8ff'
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              patch=stream.read(100001)
          assert len(patch)==56240
          expected={'site/index.html':'8535612effd85ab210fba307357ecdd7014e593c35a9734889fdeae46012e05f','site/product.js':'2b6ad252ee51a014c7ed4d2b20adcda844d9f3c982a836557db6f6dbfd615928','script/test_site.py':'c8ac2e601ed397c63a5ebdd2748fc1104a82f7ecfb75407dd51cb8adeedf8140','script/test_site_browser.py':'c21672aea31f18fa734a1582939b520db4f5ee6ae2e06c8d0dc187857ca4fe71','site/presentation.css':'2bc81dc91e2faaf2778ab86ee1b8ecd3f1bdd690cd2541c9a69356d8aef10275','script/test_site_polish.py':'534f8de80f473006772b080c71dbca9eb618ecaf8897e9c46d0a3668986929e1','script/test_presentation_browser.py':'aa5dd4b6be3bede67567b2cc8d4b1b4ac8ece8d2a4394962c8cec8d8cdf2afee'}
          stat=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {line.split('\t',2)[2] for line in stat.splitlines()}==set(expected)
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          for path,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest,path
          subprocess.run(['git','add','--',*expected],check=True)
          print('Verified all seven source files. Native source and release assets are unchanged.')
      - name: Validate source before saving the review branch
        run: |
          python3 script/test_site.py
          python3 script/test_branding.py
          python3 script/test_public_images.py
          python3 script/privacy_check.py --staged
          node --check site/product.js
          git diff --cached --check
      - name: Save validated source on review branch only
        run: |
          git config user.name 'Osman Kaan Kars'
          git config user.email '56635935+osmankaankars@users.noreply.github.com'
          git commit -m 'Show all sample files, add Workspace, and simplify product presentation'
          git push origin HEAD:refs/heads/fix/compact-gallery-20261021
