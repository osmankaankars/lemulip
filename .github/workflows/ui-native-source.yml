name: Prepare Native UI Release Source
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-native-source.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/verify/ui-resume-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f9496dd2c040a3a538bb4fea650355defcb7058d
          persist-credentials: false
      - name: Apply the exact checksum-verified native source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          prefix='https://api.github.com/repos/osmankaankars/lemulip/'
          def api(path,payload=None):
              req=urllib.request.Request(prefix+path,method='GET' if payload is None else 'POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=None if payload is None else json.dumps(payload).encode())
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          stored=api('git/blobs/4cc1d1daaed63568a9aa5989c230f7393daa834b')
          encoded=''.join(stored['content'].split())
          # Correct the one identified transport transcription before decoding.
          # The original packed SHA256 and every resulting source blob must match.
          old='lEij5XNEzE3F6l8ucUv';new='lEij5XNEzE5F6l8ucUv'
          assert encoded.count(old)==1
          packed=base64.b64decode(encoded.replace(old,new),validate=True)
          assert len(packed)==3016 and hashlib.sha256(packed).hexdigest()=='92bc8d6397b0fcc6aad890c3ef6aeedee8e160f46249e55914f56c079c04b3f9'
          patch=gzip.decompress(packed);assert len(patch)==7535
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          catalog=pathlib.Path('site/catalog.js');s=catalog.read_text();assert s.count('"version":"0.1.17"')==1;catalog.write_text(s.replace('"version":"0.1.17"','"version":"0.1.18"',1))
          subprocess.run(['git','add','site/catalog.js'],check=True)
          expected={'Sources/Lemulip/AppController.swift':'0f50e609d8cdce67b3f91ec174209d2f2a4d6dfe','docs/USER_GUIDE.md':'34e8a218e3ad6eee16c85e9961499b38397f05e6','script/test_interface.py':'a62249fe775b254fc64f1491caab3929989d8d42','Resources/Info.plist':'8e9b7f9e5a76930cd228db21f86bc218cef80ee5','docs/RELEASE_NOTES.md':'b02bf293415e2f72523488078cbab73095769d12','site/catalog.js':'72a2f07a8479dcbae2097ebf2501afd00307238b'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          for path,sha in expected.items():assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          subprocess.run(['python3','-m','unittest','discover','-s','script','-p','test_*.py'],check=True)
          subprocess.run(['python3','script/privacy_check.py','--staged'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          for path,sha in expected.items():
              data=pathlib.Path(path).read_bytes();result=api('git/blobs',dict(content=base64.b64encode(data).decode(),encoding='base64'));assert result['sha']==sha
          paths=['Sources','Tests','.github/workflows/build.yml','script/test_interface.py','Resources/Info.plist','docs/USER_GUIDE.md','docs/RELEASE_NOTES.md','site/catalog.js']
          entries=[]
          for row in subprocess.check_output(['git','ls-files','--stage','-z','--',*paths]).decode().split('\0'):
              if not row:continue
              mode,sha,rest=row.split(' ',2);stage,path=rest.split('\t',1);assert stage=='0' and mode in ('100644','100755')
              entries.append(dict(path=path,mode=mode,type='blob',sha=sha))
          result=api('git/trees',dict(base_tree='85473e0623eb5b42ed6721f4721df274bff2ed2f',tree=entries))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-source';out.mkdir()
          (out/'source-result.json').write_text(json.dumps(dict(tree=result['sha'],parent='9cfc215a9e05ced2c37d06c8e3de7546bdc9ec95',entries=entries,changedBlobs=expected),indent=2)+'\n')
          print('Native-only source tree:',result['sha'])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Native-Release-Source
          path: ${{ runner.temp }}/native-source/
          retention-days: 7
          if-no-files-found: error
