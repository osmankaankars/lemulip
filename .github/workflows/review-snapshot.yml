name: Apply Reviewed Simplification
on:
  push:
    branches: [fix/simplify-product-page-20261022]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: reviewed-simplification-import
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/fix/simplify-product-page-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Install isolated source-transform tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/review-tools"
          "$RUNNER_TEMP/review-tools/bin/pip" install tinycss2==1.5.1
      - name: Verify pinned source and exact reviewed transformation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess, urllib.request
          base='4967e504a6986a885b1d55c049138e65a06550fc'
          temporary='.github/workflows/review-snapshot.yml'
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','.',':(exclude)'+temporary],text=True).strip()==''
          request=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs/e4321011f6e9ad90aa0392722f4f2a0473babcc2',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              blob=json.load(response)
          packed=base64.b64decode(blob['content'])
          assert len(packed)==11513
          assert hashlib.sha256(packed).hexdigest()=='d219461d8e36497b4841939ebe6954aa15944c6d93d2df9968b08cb99c882a9b'
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              source=stream.read(30953)
          assert len(source)==30952
          assert hashlib.sha256(source).hexdigest()=='79aa31449d4407ea69cc63ab4f1e1ce5f9fcbd054fddac15971d965bd65ecd4a'
          tool=pathlib.Path(os.environ['RUNNER_TEMP'])/'apply-reviewed.py'
          tool.write_bytes(source)
          subprocess.run([str(pathlib.Path(os.environ['RUNNER_TEMP'])/'review-tools/bin/python'),str(tool)],check=True)
          expected=set('''CONTRIBUTING.md README.md THIRD_PARTY_NOTICES.md docs/DESIGN.md docs/DEVELOPMENT.md docs/FAQ.md docs/INSTALL.md docs/PUBLISHING.md docs/RELEASE_NOTES.md docs/ROADMAP.md docs/USER_GUIDE.md docs/assets/workflow.svg script/package_release.sh script/privacy_check.py script/test_presentation_browser.py script/test_public_images.py script/test_site.py script/test_site_browser.py script/test_site_polish.py site/assets/sample-walk.mp4 site/index.html site/presentation.css site/product.css site/product.js'''.split())
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,(actual-expected,expected-actual)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          environment=os.environ.copy()
          environment['GIT_INDEX_FILE']=str(pathlib.Path(os.environ['RUNNER_TEMP'])/'projected-index')
          subprocess.run(['git','read-tree',subprocess.check_output(['git','write-tree'],text=True).strip()],env=environment,check=True)
          subprocess.run(['git','update-index','--force-remove',temporary],env=environment,check=True)
          projected=subprocess.check_output(['git','write-tree'],env=environment,text=True).strip()
          assert projected=='46d77c8b13a71dd0c43c5d00eb663985a563fe64',projected
          print('Verified exact final tree:',projected)
      - name: Validate source and packaging references
        run: |
          python3 script/test_site.py
          python3 script/test_branding.py
          python3 script/test_public_images.py
          python3 script/privacy_check.py --staged
          node --check site/catalog.js
          node --check site/product.js
          bash -n script/package_release.sh
          git diff --cached --check
      - name: Save reviewed source on the isolated branch only
        run: |
          git config user.name 'Kaan Kars'
          git config user.email '56635935+osmankaankars@users.noreply.github.com'
          git commit -m 'Simplify product page and consolidate essential documentation'
          git push origin HEAD:refs/heads/fix/simplify-product-page-20261022
