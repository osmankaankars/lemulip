name: Native Recorder Startup Observation

on:
  push:
    branches: ['codex/drag-recorder-startup-observation-07']
    paths:
      - '.github/workflows/native-recorder-startup-observation.yml'
      - 'script/run_native_recorder_startup_observation.py'
      - 'script/test_run_native_recorder_startup_observation.py'
      - 'script/native_ui/NativeSystemTraceStartup.swift'
      - 'script/native_ui/NativeSystemTraceNotifyBridge.h'
      - 'script/run_native_system_trace_startup.py'
      - 'script/test_run_native_system_trace_startup.py'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  CANDIDATE_COMMIT: d821d7343675e2850705d141ef9b3b93a6aee945
  CANDIDATE_TREE: 425baa28f00ec24551dd70c0cc874a75fa3be0c1
  STARTUP_BASE: 93c8a8f3a65df385d77876beffafc55bdf4a2d5f
  INVENTORY_BASE: daf90a14cbe0e5855e2e4a3e69dc8c170700635d

concurrency:
  group: native-recorder-startup-observation-${{ github.ref }}
  cancel-in-progress: true

# One fixed recorder observation per architecture: installed-man gate, exact-PID
# metadata and one bounded sample within the original notification wait. No input,
# privilege/settings change, recording retry, or acceptance relaxation.
jobs:
  trace:
    name: Recorder Startup Observation (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check Out Exact Diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind Source And Portable Gates
        run: |
          mkdir -p "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/experiment-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/experiment-tree.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(uname -m)" = '${{ matrix.arch }}'
          git merge-base --is-ancestor "$INVENTORY_BASE" HEAD
          git diff --exit-code "$INVENTORY_BASE" -- Sources Resources Package.swift \
            script/build_app.sh script/prepare_native_ui.py \
            script/native_ui/NativeDragControl.swift script/native_ui/NativeDragSource.swift \
            script/native_ui/NativeDragReview.swift script/native_ui/NativeDragMouseDriver.swift \
            script/native_ui/NativeDragMouseTests.swift script/compare_native_drag_mouse_driver.py \
            script/collect_native_trace_capabilities.py script/test_collect_native_trace_capabilities.py
          git merge-base --is-ancestor "$STARTUP_BASE" HEAD
          git diff --exit-code "$STARTUP_BASE" -- \
            script/native_ui/NativeSystemTraceStartup.swift \
            script/native_ui/NativeSystemTraceNotifyBridge.h \
            script/test_run_native_system_trace_startup.py \
            .github/workflows/native-system-trace-startup.yml
          python3 script/privacy_check.py
          python3 script/test_collect_native_trace_capabilities.py \
            > "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/bounded-command-tests.stdout.txt" \
            2> "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/bounded-command-tests.stderr.txt"
          python3 script/test_run_native_system_trace_startup.py \
            > "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/orchestrator-tests.stdout.txt" \
            2> "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/orchestrator-tests.stderr.txt"
          python3 script/test_run_native_recorder_startup_observation.py \
            > "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/observer-tests.stdout.txt" \
            2> "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/observer-tests.stderr.txt"
      - name: Check Out Pinned C12 For Unchanged Staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: candidate-source
          persist-credentials: false
      - name: Verify And Build C12 For Staging
        working-directory: candidate-source
        env:
          CONFIGURATION: debug
          LEMULIP_ENGINE_PACKS: ''
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=normal)"
          ./script/build_app.sh
          python3 script/prepare_native_ui.py --app dist/Lemulip.app \
            --output "$RUNNER_TEMP/lemulip-native-ui"
      - name: Build Original Apps And Startup Helper
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, plistlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lemulip-native-ui'
          for role in ('Control', 'Source'):
              name, executable = 'Native Drag ' + role, 'NativeDrag' + role
              contents = root / (name + '.app') / 'Contents'
              (contents / 'MacOS').mkdir(parents=True, exist_ok=False)
              info = {'CFBundleIdentifier': 'app.lemulip.' + executable,
                      'CFBundleExecutable': executable, 'CFBundleName': name,
                      'CFBundleDisplayName': name, 'CFBundlePackageType': 'APPL',
                      'CFBundleShortVersionString': '0.0.0', 'CFBundleVersion': '1',
                      'NSPrincipalClass': executable + 'Application',
                      'NSHighResolutionCapable': True, 'LSMinimumSystemVersion': '13.0'}
              (contents / 'Info.plist').write_bytes(plistlib.dumps(info))
          PYCODE
          for role in Control Source; do
            xcrun swiftc -parse-as-library -g -module-name "NativeDrag$role" \
              "script/native_ui/NativeDrag$role.swift" \
              -o "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/NativeDrag$role"
            cp "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/NativeDrag$role" \
              "$RUNNER_TEMP/lemulip-native-ui/Native Drag $role.app/Contents/MacOS/NativeDrag$role"
            codesign --force --sign - "$RUNNER_TEMP/lemulip-native-ui/Native Drag $role.app"
            codesign --verify --strict "$RUNNER_TEMP/lemulip-native-ui/Native Drag $role.app"
          done
          xcrun swiftc -parse-as-library -g -module-name NativeSystemTraceStartup \
            -import-objc-header script/native_ui/NativeSystemTraceNotifyBridge.h \
            script/native_ui/NativeSystemTraceStartup.swift \
            -o "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/NativeSystemTraceStartup"
          codesign --force --sign - "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/NativeSystemTraceStartup"
      - name: Preserve Build And Immutable Input Identities
        id: provenance
        run: |
          python3 - <<'PYCODE'
          import ctypes, errno, hashlib, json, os, pathlib, platform, shutil, stat, subprocess
          root = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'lemulip-native-ui').resolve(strict=True)
          out = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'drag-recorder-startup-observation/evidence').resolve(strict=True)
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          record = json.loads((root / 'provenance.json').read_text())
          assert record['sourceCommit'] == os.environ['CANDIDATE_COMMIT']
          assert record['sourceTree'] == os.environ['CANDIDATE_TREE']
          assert record['architecture'] == platform.machine() == '${{ matrix.arch }}'
          record.update(observerExperimentCommit=os.environ['GITHUB_SHA'],
                        observerExperimentTree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                        nativeDragControlSourceSHA256=digest(pathlib.Path('script/native_ui/NativeDragControl.swift')),
                        nativeDragSourceSourceSHA256=digest(pathlib.Path('script/native_ui/NativeDragSource.swift')),
                        controlGUI_SHA256=digest(root / 'Native Drag Control.app/Contents/MacOS/NativeDragControl'),
                        sourceGUI_SHA256=digest(root / 'Native Drag Source.app/Contents/MacOS/NativeDragSource'),
                        diagnosticOnly=True, releaseReady=False, nativeAcceptanceXCTestExecuted=False,
                        physicalInputVerified=False, nativeInputExecuted=False, startupCalibrationOnly=True,
                        recorderObservationOnly=True, samplingPerturbsTiming=True,
                        scope='D21 one bounded exact-owned-recorder sample; original D20 notification/startup bounds; no native input.')
          libc = ctypes.CDLL(None, use_errno=True)
          probe = libc.sysctlbyname
          probe.argtypes = [ctypes.c_char_p, ctypes.c_void_p, ctypes.POINTER(ctypes.c_size_t), ctypes.c_void_p, ctypes.c_size_t]
          probe.restype = ctypes.c_int
          translated, length = ctypes.c_int(-1), ctypes.c_size_t(ctypes.sizeof(ctypes.c_int))
          ctypes.set_errno(0)
          rc = probe(b'sysctl.proc_translated', ctypes.byref(translated), ctypes.byref(length), None, 0)
          err = ctypes.get_errno()
          assert (rc == 0 and err == 0 and length.value == ctypes.sizeof(translated) and translated.value == 0) or (rc == -1 and err == errno.ENOENT)
          record['translationProbe'] = {'returnCode': rc, 'errno': err, 'value': translated.value if rc == 0 else None}
          binaries = {'helper': out / 'build/NativeSystemTraceStartup',
                      'control': root / 'Native Drag Control.app/Contents/MacOS/NativeDragControl',
                      'source': root / 'Native Drag Source.app/Contents/MacOS/NativeDragSource'}
          builds = {}
          for role, binary in binaries.items():
              archs = subprocess.check_output(['xcrun', 'lipo', '-archs', str(binary)], text=True).strip().split()
              assert archs == [record['architecture']]
              identity = subprocess.check_output(['xcrun', 'dwarfdump', '--uuid', str(binary)], text=True)
              loads = subprocess.check_output(['xcrun', 'otool', '-l', str(binary)], text=True)
              deps = subprocess.check_output(['xcrun', 'otool', '-L', str(binary)], text=True)
              assert 'libNativeActivationEntryProbe' not in deps
              (out / 'build' / (role + '-load-commands.txt')).write_text(loads)
              (out / 'build' / (role + '-dependencies.txt')).write_text(deps)
              (out / 'build' / (role + '-uuid.txt')).write_text(identity)
              builds[role] = {'path': str(binary), 'sha256': digest(binary), 'architectures': archs, 'uuidOutput': identity}
          record['systemTraceStartupBuilds'] = builds
          sources = out / 'sources'
          sources.mkdir(exist_ok=False)
          names = ['script/native_ui/NativeSystemTraceStartup.swift',
                   'script/native_ui/NativeSystemTraceNotifyBridge.h',
                   'script/native_ui/NativeDragControl.swift', 'script/native_ui/NativeDragSource.swift',
                   'script/run_native_system_trace_startup.py', 'script/test_run_native_system_trace_startup.py',
                   'script/collect_native_trace_capabilities.py', 'script/test_collect_native_trace_capabilities.py',
                   '.github/workflows/native-system-trace-startup.yml', 'docs/NATIVE_SYSTEM_TRACE_STARTUP.md',
                   'script/run_native_recorder_startup_observation.py',
                   'script/test_run_native_recorder_startup_observation.py',
                   '.github/workflows/native-recorder-startup-observation.yml',
                   'docs/NATIVE_RECORDER_STARTUP_OBSERVATION.md']
          for name in names:
              shutil.copyfile(name, sources / pathlib.Path(name).name)
          record['retainedDiagnosticSourcesSHA256'] = {p.name: digest(p) for p in sorted(sources.iterdir())}
          (root / 'provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          (out / 'build-provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          for name, args in [('os-version', ['sw_vers']), ('kernel-version', ['sysctl', '-n', 'kern.version']),
                             ('cpu-brand', ['sysctl', '-n', 'machdep.cpu.brand_string']), ('xcode-version', ['xcodebuild', '-version'])]:
              completed = subprocess.run(args, capture_output=True, timeout=20, check=True)
              (out / 'build' / (name + '.stdout.txt')).write_bytes(completed.stdout)
              (out / 'build' / (name + '.stderr.txt')).write_bytes(completed.stderr)
          inventory = {}
          for p in sorted(root.rglob('*')):
              if p.name == '.DS_Store': continue
              mode, relative = p.lstat().st_mode, p.relative_to(root).as_posix()
              assert not stat.S_ISLNK(mode)
              if stat.S_ISDIR(mode): inventory[relative] = {'kind': 'directory'}
              else:
                  assert stat.S_ISREG(mode)
                  inventory[relative] = {'kind': 'file', 'bytes': p.stat().st_size, 'sha256': digest(p)}
          (out / 'inputs-before.json').write_text(json.dumps(inventory, indent=2) + '\n')
          PYCODE
      - name: Observe One Exact Owned Recorder Startup
        id: recording
        run: >-
          python3 script/run_native_recorder_startup_observation.py
          --staged "$RUNNER_TEMP/lemulip-native-ui"
          --output "$RUNNER_TEMP/drag-recorder-startup-observation/evidence"
          --helper "$RUNNER_TEMP/drag-recorder-startup-observation/evidence/build/NativeSystemTraceStartup"
      - name: Verify Immutable Inputs
        if: always() && steps.provenance.outcome == 'success'
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, stat
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lemulip-native-ui'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'drag-recorder-startup-observation/evidence'
          before, after = json.loads((out / 'inputs-before.json').read_text()), {}
          output = 'NativeDragControlEvidence-Capture-ax-only-Lifecycle-appkit-MouseDriver-quartz-first'
          for p in sorted(root.rglob('*')):
              relative = p.relative_to(root).as_posix()
              if p.name == '.DS_Store' or relative == output or relative.startswith(output + '/'): continue
              mode = p.lstat().st_mode
              assert not stat.S_ISLNK(mode)
              if stat.S_ISDIR(mode): after[relative] = {'kind': 'directory'}
              else:
                  assert stat.S_ISREG(mode)
                  after[relative] = {'kind': 'file', 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
          (out / 'inputs-after.json').write_text(json.dumps(after, indent=2) + '\n')
          (out / 'input-preservation.json').write_text(json.dumps({'schema': 1, 'inputsUnchanged': before == after,
              'beforeEntries': len(before), 'afterEntries': len(after)}, indent=2) + '\n')
          assert before == after
          PYCODE
      - name: Archive Exact Staged Evidence
        if: always() && steps.provenance.outcome == 'success'
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, stat, zipfile
          root = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'lemulip-native-ui').resolve(strict=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'drag-recorder-startup-observation/evidence'
          archive, entries, expanded = out / 'staged-evidence.zip', [], 0
          with zipfile.ZipFile(archive, mode='x', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zipped:
              for p in [root, *sorted(root.rglob('*'))]:
                  mode = p.lstat().st_mode
                  assert not stat.S_ISLNK(mode) and (stat.S_ISDIR(mode) or stat.S_ISREG(mode))
                  name = p.relative_to(root.parent).as_posix()
                  if stat.S_ISREG(mode):
                      size = p.stat().st_size
                      assert size <= 64 * 1024 * 1024
                      expanded += size
                  assert expanded <= 256 * 1024 * 1024 and len(entries) < 16384
                  zipped.write(p, arcname=name)
                  entries.append(name)
          with zipfile.ZipFile(archive) as zipped: assert zipped.testzip() is None
          (out / 'staged-archive.json').write_text(json.dumps({'schema': 1, 'name': archive.name,
              'bytes': archive.stat().st_size, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'entryCount': len(entries), 'expandedFileBytes': expanded}, indent=2) + '\n')
          PYCODE
      - name: Confirm Source Remains Unchanged
        if: always()
        run: |
          git diff --exit-code HEAD --
          if test -d candidate-source/.git; then git -C candidate-source diff --exit-code HEAD --; fi
      - name: Retain Bounded Recorder Observation Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lemulip-Recorder-Startup-Observation-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/drag-recorder-startup-observation/evidence
          if-no-files-found: error
          retention-days: 14
