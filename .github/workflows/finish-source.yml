name: Verify Complete Native Gallery Tree
on:
  push:
    branches: [finish/native-gallery-and-engines-20261027]
    paths: [.github/workflows/finish-source.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/finish/native-gallery-and-engines-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 67bc5f48d3135939162c59faa78116984042a07f
          persist-credentials: false
      - name: Reconstruct exact approved patch and images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          api='https://api.github.com/repos/osmankaankars/lemulip/git/'
          def get(route):
              request=urllib.request.Request(api+route,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          def blob(sha):
              item=get('blobs/'+sha)
              assert item['encoding']=='base64'
              data=base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          chunks={}
          for sha in ['2bcdfe65a2aae68e75f09b204bba36bded1985c3','43823ebadeed140b48b70388cce17d3b012928ee']:
              tree=get('trees/'+sha)
              assert tree['sha']==sha and not tree.get('truncated')
              for item in tree['tree']:
                  assert item['type']=='blob' and item['mode']=='100644' and item['size']<=2000
                  assert item['path'] not in chunks
                  chunks[item['path']]=base64.b64decode(blob(item['sha']),validate=True)
          assert set(chunks)=={f'gallery-text-{i:02d}' for i in range(7)}
          packed=b''.join(chunks[f'gallery-text-{i:02d}'] for i in range(7))
          assert len(packed)==10012 and hashlib.sha256(packed).hexdigest()=='d42e2903d633493e264076eefda4706075dd6634fbad3e22cf95047f2ea5d010'
          decoder=lzma.LZMADecompressor(memlimit=64*1024*1024)
          patch=decoder.decompress(packed,max_length=33992)
          assert decoder.eof and not decoder.unused_data and len(patch)==33991
          assert hashlib.sha256(patch).hexdigest()=='c52d5b423a6f14776c9097b3a0e59d405729a5ce4e8ddf1cd853ebd642449791'
          paths=set('README.md THIRD_PARTY_NOTICES.md script/privacy_check.py script/test_public_images.py script/test_site.py script/test_site_browser.py site/index.html site/assets/screenshots.json site/gallery.css site/gallery.js'.split())
          stats=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {line.split('\t',2)[2] for line in stats.splitlines()}==paths
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          images={
              'app-activity':('82ef991870a355cadd7055d8316663fda29a1b46','117952195d08f546a43cfe52a729ad40bca44d5d47b141a339967b9adb2b4ea0'),
              'app-crop-video':('37f20f52cb39d9b62bcf7b2cdc4cf2c2fc158a75','a8d298b2738e78f8a4e5b4aacd463837b2ee9e4aec11290e86e2e1b984249e54'),
              'app-trim-audio':('c34c000b67a0949d608d9b68a7286dd63427421f','f34558db61c7ead7705a275e57d8331e8f5dcd6b33006c76b3d7f91b0f5ccf87'),
              'app-workspace':('b35aeb9d550fbae3e7ce092d61554c31879a0a51','d41d5ee79656a769de38c03e3e19acb0cf95a6a64a20fcecf0ab82f83d640382')}
          for name,(sha,digest) in images.items():
              data=blob(sha)
              assert hashlib.sha256(data).hexdigest()==digest
              path='site/assets/'+name+'.webp'
              pathlib.Path(path).write_bytes(data)
              paths.add(path)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='a720ee98017c55ac24633cff7fb7a183e3461e56'
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==paths
      - name: Check all final source and image rules
        run: |
          python3 script/test_site.py
          python3 script/test_branding.py
          python3 script/test_public_images.py
          python3 script/privacy_check.py --staged
          node --check site/gallery.js
          node --check site/product.js
          node --check site/catalog.js
          git diff --cached --check
      - name: Store verified Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          api='https://api.github.com/repos/osmankaankars/lemulip/git/'
          def post(route,payload):
              request=urllib.request.Request(api+route,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==14 and all(not p.startswith('.github/') for p in paths)
          entries=[]; report=[]
          for path in paths:
              data=pathlib.Path(path).read_bytes()
              item=post('blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert item['sha']==expected
              mode=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()[0]
              entries.append({'path':path,'mode':mode,'type':'blob','sha':item['sha']})
              report.append({'path':path,'sha':item['sha'],'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          tree=post('trees',{'base_tree':'c7cb8396d17abf13adc1708e7853b73551c3a1b8','tree':entries})
          assert tree['sha']=='a720ee98017c55ac24633cff7fb7a183e3461e56'
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'gallery-proof';folder.mkdir()
          proof={'base_commit':'67bc5f48d3135939162c59faa78116984042a07f','tree_sha':tree['sha'],'files':report,'branch_updated':False}
          (folder/'verified-tree.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof),flush=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: Lemulip-Verified-Gallery-Tree
          path: ${{ runner.temp }}/gallery-proof/
          retention-days: 7
          if-no-files-found: error
