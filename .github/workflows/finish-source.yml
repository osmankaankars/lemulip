name: Export Finalization Source
on:
  push:
    branches: [finish/native-gallery-and-engines-20261027]
    paths: [.github/workflows/finish-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 67bc5f48d3135939162c59faa78116984042a07f
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/lemulip-main.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Finalization-Source
          path: ${{ runner.temp }}/lemulip-main.tar.gz
          retention-days: 1
          if-no-files-found: error
