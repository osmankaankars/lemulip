name: Recover Verified Screenshot Objects
on:
  push:
    branches: [finish/native-gallery-and-engines-20261027]
    paths: [.github/workflows/finish-source.yml]
permissions:
  contents: write
jobs:
  recover:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/finish/native-gallery-and-engines-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify existing immutable image chunks and store complete image objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, concurrent.futures, hashlib, json, lzma, os, pathlib, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-images'
          root.mkdir()
          api='https://api.github.com/repos/osmankaankars/lemulip/git/'
          trees=['5c2d19f77ab0e87af92780fe3bffef6ba277af59','e5726e2e8e999f0223146c85584241d62d42382d','a0ceac6cf22509982005e1ca013a91256846f23e','111eea70ae6ea62eae55bd44941acc6393062373','669e7e33caa41d00e9d40bcd782af4bf473992b9','331e11325c8a9b364d507d47b5dc90b3d84178ce','9a1832a74a3ac46b172250901bb661b62959b5e5','75f94d3b3bfc6377af8875011963a46fadb98dd0','8c75c6cbb1f542b6eb722260c61c2defe745cfe5','5684b8b7b6efae1012ea2b30545d5be0fab6fff4','086e9f7ef2f8c19163a08ece2131c6a710804a15']
          def api_call(route, payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(api+route,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          entries=[]
          for sha in trees:
              tree=api_call('trees/'+sha)
              assert tree['sha']==sha and not tree.get('truncated')
              entries.extend(tree['tree'])
          assert len(entries)==86 and len({e['path'] for e in entries})==86
          replacements={}
          for sha in ['987e1c6b0e01b8e2614a17b1aeb9523938ec3f5b','f870aac09cb67b01c3e750d4e0f7f1155c62cf7c']:
              tree=api_call('trees/'+sha)
              assert tree['sha']==sha and not tree.get('truncated')
              replacements.update({e['path']:e for e in tree['tree']})
          assert set(replacements)=={f'app-workspace-{i:02d}' for i in range(15,21)}
          entries=[replacements.get(e['path'],e) for e in entries]
          (root/'chunk-inventory.json').write_text(json.dumps(entries,indent=2))
          def read(item):
              assert item['type']=='blob' and item['mode']=='100644' and item['size']<=2000
              blob=api_call('blobs/'+item['sha'])
              assert blob['encoding']=='base64'
              text=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(text)).encode()+b'\0'+text).hexdigest()==item['sha']
              return item['path'],base64.b64decode(text,validate=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              chunks=dict(pool.map(read,entries))
          expected={
              'app-activity':(16,24456,'117952195d08f546a43cfe52a729ad40bca44d5d47b141a339967b9adb2b4ea0'),
              'app-crop-video':(25,37140,'a8d298b2738e78f8a4e5b4aacd463837b2ee9e4aec11290e86e2e1b984249e54'),
              'app-trim-audio':(24,36088,'f34558db61c7ead7705a275e57d8331e8f5dcd6b33006c76b3d7f91b0f5ccf87'),
              'app-workspace':(21,31794,'d41d5ee79656a769de38c03e3e19acb0cf95a6a64a20fcecf0ab82f83d640382')}
          verified={}
          for name,(count,size,digest) in expected.items():
              packed=b''.join(chunks[f'{name}-{i:02d}'] for i in range(count))
              decoder=lzma.LZMADecompressor(memlimit=64*1024*1024)
              data=decoder.decompress(packed,max_length=size+1)
              assert decoder.eof and not decoder.unused_data and len(data)==size,name
              assert hashlib.sha256(data).hexdigest()==digest,name
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              verified[name]=data
          objects=[]
          for name,data in verified.items():
              blob=api_call('blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              expected_sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert blob['sha']==expected_sha
              item={'path':'site/assets/'+name+'.webp','sha':blob['sha'],'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              objects.append(item)
              (root/(name+'.webp')).write_bytes(data)
              print(json.dumps(item),flush=True)
          (root/'verified-objects.json').write_text(json.dumps(objects,indent=2))
          print('All four images verified. No branch, published page, or release was changed by this job.')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Verified-Screenshot-Objects
          path: ${{ runner.temp }}/verified-images/
          retention-days: 7
          if-no-files-found: error
