name: Verify Published UI Downloads And Site
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-publication-verification.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/verify/ui-resume-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4a7db09aee9444faeeb1e75cf172bedab61a4529
          persist-credentials: false
      - name: Verify the public download bytes and deployed site against reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,sys,urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          sha='aaf8213653e8b80f1f3ade4ada28b3b6de468f0f'
          req=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect()).open(req,timeout=30) as response:raw=response.read(24001)
          assert len(raw)<=24000
          obj=json.loads(raw)
          source=base64.b64decode(''.join(obj['content'].split()),validate=True)
          assert len(source)==7940
          assert hashlib.sha1(b'blob '+str(len(source)).encode()+b'\0'+source).hexdigest()==sha
          assert hashlib.sha256(source).hexdigest()=='17d0c0991e27b81d32c1ca2590fd57ecb860df72cc4135c08f4f3eff59bdf220'
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='3395adebfec20e675728ece7de029d712278cb3d'
          tool=pathlib.Path(os.environ['RUNNER_TEMP'])/'check-publication.py'
          tool.write_bytes(source)
          subprocess.run([sys.executable,str(tool)],check=True)
          subprocess.run(['git','diff','--exit-code'],check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Published-UI-Verification
          path: ${{ runner.temp }}/publication-verification/
          retention-days: 7
          if-no-files-found: error
