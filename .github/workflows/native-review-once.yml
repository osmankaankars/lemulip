name: Inspect Published Native UI Once
on:
  push:
    branches: [verify/native-ui-20261028]
    paths: [.github/workflows/native-review-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bff69c602295eb18ab32b80cb40908fd4c5240aa
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Lemulip-macOS-universal
          run-id: 40622450424
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published
          digest-mismatch: error
      - name: Verify Published Bytes And Prepare Native Probe
        run: |
          mkdir -p "$RUNNER_TEMP/native-review"
          python3 - <<'PYCODE'
          import hashlib,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'published/Lemulip-0.1.17-macOS-universal.zip'
          assert p.stat().st_size==153096832
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='a48b8d36a606a85398dded5019326287218c8478fa479751ff4ad0e3a5d852d4'
          PYCODE
          ditto -xk "$RUNNER_TEMP/published/Lemulip-0.1.17-macOS-universal.zip" "$RUNNER_TEMP/native-app"
          cat > "$RUNNER_TEMP/native-review.swift" <<'SWIFT'
          import AppKit
          import ApplicationServices
          import CoreGraphics
          import Foundation
          
          let args = CommandLine.arguments
          precondition(args.count == 3)
          let bundle = URL(fileURLWithPath: args[1])
          let output = URL(fileURLWithPath: args[2], isDirectory: true)
          try FileManager.default.createDirectory(at: output, withIntermediateDirectories: true)
          func settle(_ seconds: Double) {
              let until = Date().addingTimeInterval(seconds)
              while Date() < until { RunLoop.current.run(until: Date().addingTimeInterval(0.05)) }
          }
          func attribute(_ element: AXUIElement, _ name: String) -> AnyObject? {
              var value: CFTypeRef?
              guard AXUIElementCopyAttributeValue(element, name as CFString, &value) == .success else { return nil }
              return value
          }
          func elements(_ root: AXUIElement) -> [AXUIElement] {
              var queue: [(AXUIElement, Int)] = [(root, 0)]
              var result: [AXUIElement] = []
              while !queue.isEmpty && result.count < 600 {
                  let (element, depth) = queue.removeFirst()
                  result.append(element)
                  if depth < 12, let children = attribute(element, kAXChildrenAttribute) as? [AXUIElement] {
                      queue += children.map { ($0, depth + 1) }
                  }
              }
              return result
          }
          func texts(_ root: AXUIElement) -> [String] {
              elements(root).flatMap { element in
                  [kAXTitleAttribute, kAXDescriptionAttribute, kAXValueAttribute].compactMap { attribute(element, $0) as? String }
              }
          }
          func windows(_ pid: pid_t) -> [[String: Any]] {
              let all = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID) as? [[String: Any]] ?? []
              return all.filter { ($0[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == pid && ($0[kCGWindowLayer as String] as? NSNumber)?.intValue == 0 }
          }
          func capture(_ pid: pid_t, _ name: String) -> Bool {
              guard CGPreflightScreenCaptureAccess(), let window = windows(pid).first,
                    let id = window[kCGWindowNumber as String] as? NSNumber else { return false }
              let file = output.appendingPathComponent(name + ".png")
              let task = Process(); task.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
              task.arguments = ["-x", "-l", id.stringValue, file.path]
              do { try task.run(); task.waitUntilExit(); return task.terminationStatus == 0 && FileManager.default.fileExists(atPath: file.path) }
              catch { return false }
          }
          var report: [String: Any] = [
              "version": "0.1.17", "macOS": ProcessInfo.processInfo.operatingSystemVersionString,
              "screenCount": NSScreen.screens.count, "accessibilityTrusted": AXIsProcessTrusted(),
              "screenCaptureAllowed": CGPreflightScreenCaptureAccess(),
              "manualVoiceOverReviewed": false, "physicalMultipleDisplaysReviewed": false,
              "microsoftOfficeReviewed": false
          ]
          var installed: [String: String] = [:]
          for name in ["Microsoft Word", "Microsoft Excel", "Microsoft PowerPoint"] {
              let path = "/Applications/" + name + ".app"
              if let app = Bundle(path: path) { installed[name] = app.infoDictionary?["CFBundleShortVersionString"] as? String ?? "unknown" }
          }
          report["installedOfficeApplications"] = installed
          var launched: NSRunningApplication?
          var launchError: String?
          let config = NSWorkspace.OpenConfiguration(); config.activates = true; config.createsNewApplicationInstance = true
          NSWorkspace.shared.openApplication(at: bundle, configuration: config) { app, error in
              launched = app; launchError = error?.localizedDescription
          }
          let deadline = Date().addingTimeInterval(20)
          while launched == nil && launchError == nil && Date() < deadline { settle(0.1) }
          var checks: [[String: Any]] = []
          if let app = launched {
              defer { app.terminate() }
              settle(2)
              report["launchAlive"] = !app.isTerminated
              report["visibleWindowCount"] = windows(app.processIdentifier).count
              checks.append(["name": "Workspace Screenshot", "captured": capture(app.processIdentifier, "workspace")])
              if AXIsProcessTrusted() {
                  let root = AXUIElementCreateApplication(app.processIdentifier)
                  AXUIElementSetMessagingTimeout(root, 1)
                  let initial = texts(root)
                  report["workspaceHeadingPresent"] = initial.contains(where: { $0.contains("A Fresh Spin On Your Files.") })
                  for (name, heading) in [("Activity", "A Little Less Busywork."), ("Settings", "Small App. Your Rules."), ("Workspace", "A Fresh Spin On Your Files.")] {
                      let button = elements(root).first { element in
                          (attribute(element, kAXRoleAttribute) as? String) == kAXButtonRole && texts(element).contains(name)
                      }
                      guard let button else { checks.append(["name": name, "status": "button-not-found"]); continue }
                      let result = AXUIElementPerformAction(button, kAXPressAction as CFString)
                      settle(2)
                      let visible = texts(root)
                      let present = visible.contains { $0.contains(heading) }
                      checks.append(["name": name, "actionCode": result.rawValue, "headingPresent": present,
                                     "captured": capture(app.processIdentifier, name.lowercased()),
                                     "status": result == .success && present ? "passed" : "failed"])
                      if name == "Settings" { report["settingsText"] = visible }
                  }
              } else {
                  report["navigationStatus"] = "not-run-accessibility-permission-unavailable"
              }
              report["aliveAfterChecks"] = !app.isTerminated
          } else {
              report["launchAlive"] = false; report["launchError"] = launchError ?? "launch-timeout"
          }
          report["checks"] = checks
          let data = try JSONSerialization.data(withJSONObject: report, options: [.prettyPrinted, .sortedKeys])
          try data.write(to: output.appendingPathComponent("native-review.json"))
          print(String(data: data, encoding: .utf8)!)
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/native-review.swift" -o "$RUNNER_TEMP/native-review-probe"
      - name: Inspect Existing Permissions And Native App Without Changing Them
        run: |
          "$RUNNER_TEMP/native-review-probe" "$RUNNER_TEMP/native-app/Lemulip-0.1.17-macOS-universal/Lemulip.app" "$RUNNER_TEMP/native-review"
      - name: Check Existing Window Recovery Tests On macOS
        run: |
          set -o pipefail
          xcrun swift test --jobs 2 --filter WorkspaceWindowPlacementTests 2>&1 | tee "$RUNNER_TEMP/native-review/window-tests.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Native-UI-Review
          path: ${{ runner.temp }}/native-review/
          retention-days: 7
          if-no-files-found: error
