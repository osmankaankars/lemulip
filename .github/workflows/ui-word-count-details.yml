name: Native Word Count Disclosure Acceptance
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-word-count-details.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d37620cc24735a056ed473eb343565650d9e5548
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Lemulip-Native-Word-Count-Final
          run-id: 40748029200
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-proof
          digest-mismatch: error
      - name: Build the exact release head
        run: CONFIGURATION=debug ./script/build_app.sh
      - name: Validate completion, disclosed note, and continued queue processing
        run: |
          mkdir -p "$RUNNER_TEMP/word-count-review"
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);data=(root/'previous-proof/probe.swift').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='74a7696921509144f487a7d4c3f79cfc15cb178786f1e3266b07e4dad3beb30a'
          code=data.decode()
          old='try require(waitFor({ containsText("4 words") && containsText(String(count) + " Completed") }), "Note-only result or queue continuation missing")'
          new='''try require(waitFor({ containsText(String(count) + " Completed") }), "Successful completion or queue continuation missing")
                  if let window = mainWindow() {
                      for element in nodes(window) where strings(element).contains("Details") {
                          _ = AXUIElementPerformAction(element, kAXPressAction as CFString)
                      }
                  }
                  try require(waitFor({ containsText("4 words") }), "Word count note missing from expanded Details")'''
          assert code.count(old)==1;code=code.replace(old,new)
          old='application?.terminate(); _ = waitFor({ application?.isTerminated ?? true }, seconds: 10)'
          new='''if report["status"] as? String != "passed", let window = mainWindow() {
              report["visibleStrings"] = nodes(window).flatMap(strings)
              if CGPreflightScreenCaptureAccess() { try? capture("failure-" + CommandLine.arguments[4]) }
          }
          application?.terminate(); _ = waitFor({ application?.isTerminated ?? true }, seconds: 10)'''
          assert code.count(old)==1;code=code.replace(old,new)
          (root/'word-count-review/probe.swift').write_text(code)
          PY
          xcrun swiftc "$RUNNER_TEMP/word-count-review/probe.swift" -o "$RUNNER_TEMP/word-count"
          for mode in finder card; do
            defaults write app.freewheel.Freewheel language -string en
            defaults write app.freewheel.Freewheel completionPresentation -string "$mode"
            "$RUNNER_TEMP/word-count" "$PWD/dist/Lemulip.app" "$RUNNER_TEMP/word-count-review" "$RUNNER_TEMP/word-fixture-$mode" "$mode"
          done
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Native-Word-Count-Acceptance
          path: ${{ runner.temp }}/word-count-review/
          retention-days: 7
          if-no-files-found: error
