name: Apply Verified Engine And Activity Changes
on:
  push:
    branches: [feat/engine-packs-and-activity-20261027]
    paths: [.github/workflows/next-source.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/feat/engine-packs-and-activity-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Verify exact patch bytes before applying any source
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,gzip,hashlib,io,json,os,pathlib,subprocess,urllib.request
          base='b6fde340c3e8a802ab8b4d4a75019b84b7c98495'
          temporary='.github/workflows/next-source.yml'
          assert not subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','.',':(exclude)'+temporary],text=True).strip()
          objects=['91e8ce9aea773829bb5530bedefe478c64e769fd','73f9799cc88d4078d8d3343bbb87e339634b9e73','c0e7e292a909efbaa511c0aee4abbffc87a28451','fe1f24d1b927b67982a71bff7c050f8f25e09aab']
          parts=[]
          for index,sha in enumerate(objects):
              request=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: obj=json.load(response)
              data=base64.b64decode(obj['content'])
              if index==2:
                  encoded=base64.b64encode(data).decode()
                  marker='ECq9jN/Ur+deZt8O1V+'
                  assert encoded.count(marker)==2
                  encoded=encoded[:encoded.index(marker)+len(marker)]+encoded[encoded.rindex(marker)+len(marker):]
                  data=base64.b64decode(encoded,validate=True)
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='b8b52fa19ad12860fd102d1ce33b6896f9782069'
              parts.append(data)
          packed=b''.join(parts)
          assert len(packed)==21206
          assert hashlib.sha256(packed).hexdigest()=='c2ab03a17b30297543d67814621ea70d9c0ca814ba73c31320be34e93b24c720'
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream: patch=stream.read(83613)
          assert len(patch)==83612
          assert hashlib.sha256(patch).hexdigest()=='62f5df95bf01f40e779527177da3f1549b5badec4dda0c65e5b87067f20bff51'
          expected=set('''Sources/Lemulip/ActivityView.swift Sources/Lemulip/AppController.swift Sources/Lemulip/EngineInstallButton.swift Sources/Lemulip/SettingsView.swift Sources/LemulipCore/ConversionEngine.swift Sources/LemulipCore/ConversionProgress.swift Sources/LemulipCore/EngineInstaller.swift Sources/LemulipCore/ExternalConverters.swift Sources/LemulipCore/NativeConverter.swift Sources/LemulipCore/ProcessRunner.swift Tests/LemulipCoreTests/ConversionProgressTests.swift Tests/LemulipCoreTests/EngineInstallerTests.swift docs/DEVELOPMENT.md docs/USER_GUIDE.md script/build_app.sh script/bundle_engines.py script/install_ci_pandoc.sh script/test_engine_packs.py'''.split())
          stat=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {line.split('\t',2)[2] for line in stat.splitlines()}==expected
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          test=pathlib.Path('Tests/LemulipCoreTests/EngineInstallerTests.swift')
          text=test.read_text().replace(', "https://user:pass'+'@github.com/a"','')
          text=text.replace('        XCTAssertTrue(PandocPackage.allowsDownload(URL(string: "https://release-assets','        var credentials = URLComponents(string: "https://github.com/a")!\n        credentials.user = "fixture"; credentials.password = "fixture"\n        XCTAssertFalse(PandocPackage.allowsDownload(credentials.url!))\n        XCTAssertTrue(PandocPackage.allowsDownload(URL(string: "https://release-assets')
          test.write_text(text)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          env=os.environ.copy();env['GIT_INDEX_FILE']=str(pathlib.Path(os.environ['RUNNER_TEMP'])/'projected-index')
          subprocess.run(['git','read-tree',subprocess.check_output(['git','write-tree'],text=True).strip()],env=env,check=True)
          subprocess.run(['git','update-index','--force-remove',temporary],env=env,check=True)
          tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree=='e20c3c78db4b17779e726c4cea9b82a27913d310',tree
          print('Exact verified source tree:',tree)
      - name: Validate import
        run: |
          python3 script/test_engine_packs.py
          python3 script/test_site.py
          python3 script/test_branding.py
          python3 script/test_public_images.py
          python3 script/privacy_check.py --staged
          bash -n script/build_app.sh
          bash -n script/install_ci_pandoc.sh
          git diff --cached --check
      - name: Save isolated branch
        run: |
          git config user.name 'Kaan Kars'
          git config user.email '56635935+osmankaankars@users.noreply.github.com'
          git commit -m 'Add verified Pandoc installation, engine pack validation, progress and retry'
          git push origin HEAD:refs/heads/feat/engine-packs-and-activity-20261027
