name: Next Source Snapshot
on:
  push:
    branches: [feat/engine-packs-and-activity-20261027]
    paths: [.github/workflows/next-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b6fde340c3e8a802ab8b4d4a75019b84b7c98495
          persist-credentials: false
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/next-source.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Next-Source
          path: ${{ runner.temp }}/next-source.tar.gz
          retention-days: 1
