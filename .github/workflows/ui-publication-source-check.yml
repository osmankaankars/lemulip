name: UI Publication Source Check
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-publication-source-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4a7db09aee9444faeeb1e75cf172bedab61a4529
          persist-credentials: false
      - name: Verify the exact reviewed tree and source checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 3395adebfec20e675728ece7de029d712278cb3d
          mkdir -p "$RUNNER_TEMP/ui-publication-source"
          python3 -m venv "$RUNNER_TEMP/ui-tools"
          "$RUNNER_TEMP/ui-tools/bin/pip" install playwright==1.61.0
          "$RUNNER_TEMP/ui-tools/bin/python" -m unittest discover -s script -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/ui-publication-source/python-tests.log"
          node script/test_catalog_search.js | tee "$RUNNER_TEMP/ui-publication-source/catalog-tests.log"
          node script/test_demo_view.js | tee "$RUNNER_TEMP/ui-publication-source/demo-tests.log"
          python3 script/privacy_check.py --staged | tee "$RUNNER_TEMP/ui-publication-source/privacy.log"
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ui-publication-source/source-identity.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/ui-publication-source/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/ui-publication-source/source.tar.gz" > "$RUNNER_TEMP/ui-publication-source/source-sha256.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-UI-Publication-Source
          path: ${{ runner.temp }}/ui-publication-source/
          retention-days: 7
          if-no-files-found: error
