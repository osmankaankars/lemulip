name: Refined Native UI Acceptance
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-native-acceptance.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f9496dd2c040a3a538bb4fea650355defcb7058d
          persist-credentials: false
      - name: Download the unchanged public engine donor
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 30 --max-time 180 --max-filesize 153096832 'https://github.com/osmankaankars/lemulip/releases/download/v0.1.17/Lemulip-0.1.17-macOS-universal.zip' -o "$RUNNER_TEMP/published/Lemulip-0.1.17-macOS-universal.zip"
      - name: Review the unmodified application with real inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,textwrap,urllib.request
          sha='d84a2c975fc3b534354c35d91ff517430766fd57'
          req=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:raw=base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
          body=textwrap.dedent(raw.decode().split('        run: |\n',1)[1].split('      - name: Require explicit',1)[0])
          unpack='ditto -xk "$RUNNER_TEMP/candidate/Lemulip-Refined-Preview.zip" "$RUNNER_TEMP/native"'
          assert body.count(unpack)==1
          body=body.replace(unpack,'CONFIGURATION=debug ./script/build_app.sh\nditto dist/Lemulip.app "$RUNNER_TEMP/native/Lemulip.app"')
          new='''func typeText(_ text: String, into field: AXUIElement) throws {
              guard let r = elementFrame(field) else { throw ReviewFailure(message: "Text field has no bounds") }
              application?.activate(); settle(0.15)
              mouse(.mouseMoved, CGPoint(x: r.midX, y: r.midY))
              mouse(.leftMouseDown, CGPoint(x: r.midX, y: r.midY))
              mouse(.leftMouseUp, CGPoint(x: r.midX, y: r.midY)); settle(0.15)
              key(0, flags: .maskCommand); key(51)
              if !text.isEmpty {
                  let chars = Array(text.utf16)
                  for down in [true, false] {
                      let e = CGEvent(keyboardEventSource: nil, virtualKey: 0, keyDown: down)!
                      e.keyboardSetUnicodeString(stringLength: chars.count, unicodeString: chars)
                      e.post(tap: .cghidEventTap)
                  }
              }
              settle(0.5)
          }
          func writeSearch(_ text: String) throws {
              guard let field = find("workspace.operation-search") else { throw ReviewFailure(message: "Search field missing") }
              try typeText(text, into: field)
          }
          '''
          background='''    phase = "background-completion"
              if let button = findText("Dismiss Results") { AXUIElementPerformAction(button, kAXPressAction as CFString) }
              try openFile("focus-check.mov"); try writeSearch("webm")
              guard let convert = find("operation.convert.webm") else { throw ReviewFailure(message: "Background conversion control missing") }
              let clipboardBackground = NSPasteboard.general.changeCount
              try require(AXUIElementPerformAction(convert, kAXPressAction as CFString) == .success, "Background conversion not started")
              finder.activate()
              try require(waitFor({ NSWorkspace.shared.frontmostApplication?.bundleIdentifier == "com.apple.finder" }, seconds: 5), "Finder did not become foreground")
              try require(!windows().contains { abs((bounds($0)?.width ?? 0) - 396) < 2 }, "Background conversion finished before focus could be tested")
              report["backgroundBeforeCompletion"] = NSWorkspace.shared.frontmostApplication?.bundleIdentifier ?? "none"
              try require(waitFor({ FileManager.default.fileExists(atPath: fixtures.appendingPathComponent("focus-check-converted.webm").path) && windows().contains { abs((bounds($0)?.width ?? 0) - 396) < 2 } }, seconds: 90), "Background conversion result missing")
              settle(0.6)
              report["backgroundAfterCompletion"] = NSWorkspace.shared.frontmostApplication?.bundleIdentifier ?? "none"
              report["resultCardDoesNotStealFocus"] = NSWorkspace.shared.frontmostApplication?.bundleIdentifier == "com.apple.finder"
              report["noAutomaticClipboardWrite"] = report["noAutomaticClipboardWrite"] as? Bool == true && clipboardBackground == NSPasteboard.general.changeCount
              try require(report["resultCardDoesNotStealFocus"] as? Bool == true, "Background result card changed foreground app")
              try require(report["noAutomaticClipboardWrite"] as? Bool == true, "Background result changed clipboard")
              if let button = findText("Dismiss Results") { AXUIElementPerformAction(button, kAXPressAction as CFString) }
              phase = "themes"
          '''
          history='''try require(waitFor({ mainWindow() != nil }), "Relaunched workspace not ready")
              let workspaceText = mainWindow().map { nodes($0).flatMap(strings) } ?? []
              try require(!workspaceText.contains { $0.contains("morning-light") || $0.contains("studio-voice") || $0.contains("focus-check") }, "Workspace file selection unexpectedly persisted")
              try press("navigation.activity")
              let activityText = mainWindow().map { nodes($0).flatMap(strings) } ?? []
              try require(!activityText.contains { $0.contains("morning-light") || $0.contains("studio-voice") || $0.contains("focus-check") }, "Activity history unexpectedly persisted")
              try press("navigation.workspace")'''
          edits={
            'settle(1); try resize(1020, 700)':'try require(waitFor({ mainWindow() != nil }, seconds: 20), "Main window not ready"); try resize(1020, 700)',
            'try require(AXUIElementSetAttributeValue(field, kAXValueAttribute as CFString, value as CFString) == .success, "Field edit failed")':'try typeText(value, into: field); key(48)',
            'finder.activate(); key(19, flags: .maskCommand); settle(0.6)':'finder.activate(); key(19, flags: .maskCommand); settle(0.6); key(1, flags: [.maskCommand, .maskAlternate]); settle(0.4)',
            'report["resultCardDoesNotStealFocus"] = frontBefore == NSWorkspace.shared.frontmostApplication?.processIdentifier':'report["finderDropChangesFocus"] = frontBefore != NSWorkspace.shared.frontmostApplication?.processIdentifier',
            'try require(report["resultCardDoesNotStealFocus"] as? Bool == true && report["noAutomaticClipboardWrite"] as? Bool == true, "Automatic results changed focus or clipboard")':'try require(report["noAutomaticClipboardWrite"] as? Bool == true, "Automatic result changed clipboard")',
            '    phase = "themes"':background,
            'try require(!containsText("morning-light.png") && !containsText("morning-light-converted.jpg"), "File history unexpectedly persisted")':history
          }
          snippet='import os,pathlib\np=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-review.swift"\ns=p.read_text()\na=s.index("func writeSearch(");b=s.index("func editorReady()",a)\ns=s[:a]+'+repr(new)+'+s[b:]\nedits='+repr(edits)+'\nfor a,b in edits.items():\n assert s.count(a)==1,a\n s=s.replace(a,b)\np.write_text(s)\n'
          marker='xcrun swiftc "$RUNNER_TEMP/native-review.swift"'
          assert body.count(marker)==1
          fixture='"$APP/Contents/Helpers/ffmpeg" -v error -f lavfi -i "testsrc2=size=960x540:rate=24:duration=12" -c:v libx264 -preset veryfast -pix_fmt yuv420p -an "$RUNNER_TEMP/Studio Samples/focus-check.mov"\n'
          body=body.replace(marker,fixture+'python3 - <<\'PATCH\'\n'+snippet+'PATCH\n'+marker)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'native-acceptance.sh').write_text(body)
          PY
          status=0
          bash -euo pipefail "$RUNNER_TEMP/native-acceptance.sh" || status=$?
          cp "$RUNNER_TEMP/native-review.swift" "$RUNNER_TEMP/ui-review/review-probe.swift"
          git diff --exit-code
          exit "$status"
      - name: Require every acceptance check
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-review'
          r=json.loads((p/'native-review.json').read_text());assert r['status']=='passed',r
          for key in ('realFinderDrag','originalPreserved','resultCardDoesNotStealFocus','noAutomaticClipboardWrite','explicitCopyAndFloat','turkishCompact','pinsSurviveRelaunch','noPersistentFileHistory','threeThemes','contextualSearchAndPins'):assert r[key] is True,key
          assert (p/'finder-recording.mov').stat().st_size>10000
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Refined-Native-Acceptance
          path: ${{ runner.temp }}/ui-review/
          retention-days: 7
          if-no-files-found: error
