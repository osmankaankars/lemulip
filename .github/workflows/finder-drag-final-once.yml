name: Verify Published Finder Drag With A Checked Fixture
on:
  push:
    branches: [verify/remaining-checks-20261028]
    paths: [.github/workflows/finder-drag-final-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1f47dd947fc3da103f2a08d785ddc23688dceb44
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Lemulip-macOS-universal
          run-id: 40622450424
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published
          digest-mismatch: error
      - name: Correct the fixture and expected output in the pinned probe
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct,textwrap,zlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          folder=root/'finder-review/Lemulip-Finder-Fixture'
          folder.mkdir(parents=True)
          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
          raw=b''.join(b'\0'+bytes(v for x in range(32) for v in (x*8,y*10,102,255)) for y in range(24))
          image=(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',32,24,8,6,0,0,0))
                 +chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))
          (folder/'finder-input.png').write_bytes(image)
          (root/'finder-review/fixture-manifest.json').write_text(json.dumps({
              'width':32,'height':24,'format':'PNG','opaque':True,
              'pattern':'red=x*8, green=y*10, blue=102, alpha=255',
              'sourceSHA256':hashlib.sha256(image).hexdigest()},indent=2)+'\n')
          workflow=pathlib.Path('.github/workflows/finder-drag-once.yml').read_text()
          body=workflow.split('        run: |\n',1)[1].split('      - uses:',1)[0]
          for old,new in [(')==.success',') == .success'),(']=!running','] = !running')]:
              assert body.count(old)==1
              body=body.replace(old,new)
          start=body.index('              let bitmap=')
          stop=body.index('              stage="launch"',start)
          body=body[:start]+'              let original=try Data(contentsOf:source)\n'+body[stop:]
          assert body.count('finder-input.jpg')==2
          body=body.replace('finder-input.jpg','finder-input-converted.jpg')
          marker='              if let w=windows(running.processIdentifier).first(where:'
          assert body.count(marker)==1
          assertion='              try require(report["activityShowsOutput"] as? Bool == true,"Activity did not show the actual converted output")\n'
          body=body.replace(marker,assertion+marker)
          target=root/'run-finder-final.sh'
          target.write_text(textwrap.dedent(body))
          PY
          bash -n "$RUNNER_TEMP/run-finder-final.sh"
          bash "$RUNNER_TEMP/run-finder-final.sh"
      - name: Require explicit success and unchanged source
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'finder-review'
          result=json.loads((root/'finder-review.json').read_text())
          fixture=json.loads((root/'fixture-manifest.json').read_text())
          assert result['status']=='passed',result
          for key in ('realFinderDragPayload','leftButtonObserved','wheelVisible','originalPreserved','activityShowsOutput','appAlive'):
              assert result.get(key) is True,key
          assert result['permissionsModified'] is False
          assert result['physicalHumanGesture'] is False
          assert (result['outputWidth'],result['outputHeight'])==(32,24)
          source=root/'Lemulip-Finder-Fixture/finder-input.png'
          output=root/'Lemulip-Finder-Fixture/finder-input-converted.jpg'
          assert hashlib.sha256(source.read_bytes()).hexdigest()==fixture['sourceSHA256']
          assert hashlib.sha256(output.read_bytes()).hexdigest()==result['outputSHA256']
          assert output.read_bytes().startswith(b'\xff\xd8')
          result['fixtureSHA256']=fixture['sourceSHA256']
          result['fixturePattern']=fixture['pattern']
          result['expectedOutputName']=output.name
          result['publishedAppUnmodified']=True
          (root/'finder-review.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Finder-Drag-Final-Review
          path: ${{ runner.temp }}/finder-review/
          if-no-files-found: error
          retention-days: 7
