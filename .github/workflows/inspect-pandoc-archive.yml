name: Apply Verified Package Alias Fix
on:
  push:
    branches: [feat/engine-packs-and-activity-20261027]
    paths: [.github/workflows/inspect-pandoc-archive.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/feat/engine-packs-and-activity-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 10
      - name: Verify and apply the exact tested patch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,gzip,hashlib,io,json,os,pathlib,subprocess,urllib.request
          temporary='.github/workflows/inspect-pandoc-archive.yml'
          base='f0d761d1f44a6e3739bf035229081af32a12cf5e'
          assert not subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','.',':(exclude)'+temporary],text=True).strip()
          request=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs/4f7937b1dd22f6cd9437ad9c09aaca94a1fa6113',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
          packed=base64.b64decode(blob['content'])
          assert len(packed)==3922 and hashlib.sha256(packed).hexdigest()=='cffa6d18964697e9c0846cc15c935c844f0ab2b4f10b6c3cac6d7f376dfe6f90'
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream: patch=stream.read(14361)
          assert len(patch)==14360 and hashlib.sha256(patch).hexdigest()=='a9c54e4f75bd9f7db5e1e3d4cc50e493da677b630a00db2c2a743c69334c3555'
          expected=set('''Sources/CLemulipArchive/LemulipArchive.c Sources/CLemulipArchive/include/LemulipArchive.h Sources/LemulipCore/ExternalConverters.swift Sources/LemulipCore/EngineInstaller.swift Tests/LemulipCoreTests/EngineArchiveTests.swift'''.split())
          stat=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {line.split('\t',2)[2] for line in stat.splitlines()}==expected
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          env=os.environ.copy();env['GIT_INDEX_FILE']=str(pathlib.Path(os.environ['RUNNER_TEMP'])/'projected-index')
          subprocess.run(['git','read-tree',subprocess.check_output(['git','write-tree'],text=True).strip()],env=env,check=True)
          subprocess.run(['git','update-index','--force-remove',temporary],env=env,check=True)
          tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree=='7ddc8441fac72e352179b61bfe6e5e5c0eac5096',tree
          print('Verified exact tested tree:',tree)
      - name: Check public source and publish isolated branch
        run: |
          python3 script/test_engine_packs.py
          python3 script/test_site.py
          python3 script/test_branding.py
          python3 script/test_public_images.py
          python3 script/privacy_check.py --staged
          git diff --cached --check
          git config user.name 'Kaan Kars'
          git config user.email '56635935+osmankaankars@users.noreply.github.com'
          git commit -m 'Omit verified Pandoc aliases without relaxing user archive safety'
          git push origin HEAD:refs/heads/feat/engine-packs-and-activity-20261027
