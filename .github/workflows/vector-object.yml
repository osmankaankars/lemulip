name: Prepare Reviewed Test Vector
on:
  push:
    branches: [refresh/lemulip-2026-10-21]
    paths: ['.github/workflows/vector-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/refresh/lemulip-2026-10-21'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify a single test-vector correction and create an unassigned Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          data=pathlib.Path('Tests/LemulipCoreTests/EngineTests.swift').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '724b65a892327714bb687578b4d8896cda1dfb38948c5a5837d58a28bf08df50'
          value='file:///private/tmp/lemulip-profile'
          digest=''.join(format(byte,'x') for byte in hashlib.md5(value.encode('utf-16le')).digest())
          assert digest == 'e02d3c3cf665647c3be15017e1a5255'
          old=b'("file:///private/tmp/lemulip-profile", "8dde90caf5ca1b752d47c91e1954854")'
          new=('("'+value+'", "'+digest+'")').encode()
          assert data.count(old) == 1
          corrected=data.replace(old,new)
          assert hashlib.sha256(corrected).hexdigest() == '787777afe5a307a87f875d66f5a2f250ba6919923dc333e8b248217dd7af114a'
          payload=json.dumps({'content':base64.b64encode(corrected).decode(),'encoding':'base64'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              result=json.load(response)
          assert result['sha'] == 'a408bef0fd44ffeb9d7f5ae56150880b312b6acb'
          print('Verified corrected test object:',result['sha'])
          print('No source file, branch, or release has been modified by this job.')
