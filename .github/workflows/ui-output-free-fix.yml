name: Verify Output-Free Completion Guard
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-output-free-fix.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/verify/ui-resume-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cc85bbf8eafb7be7ce90f136796216ec4a168f87
          persist-credentials: false
      - name: Install test import dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/test-tools"
          "$RUNNER_TEMP/test-tools/bin/pip" install playwright==1.61.0
      - name: Reproduce and correct output-free completion presentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/test-tools/bin/python" - <<'PY'
          import base64,json,os,pathlib,subprocess,textwrap,urllib.request
          test=pathlib.Path('script/test_interface.py');s=test.read_text()
          insert='''    def test_output_free_success_does_not_present_a_missing_file(self):
                  source = (APP/'AppController.swift').read_text()
                  completion = source.split('self.update(id) { $0.state = .succeeded;', 1)[1].split('} catch {', 1)[0]
                  self.assertIn('if !result.outputs.isEmpty {', completion)
                  before, guarded = completion.split('if !result.outputs.isEmpty {', 1)
                  self.assertNotIn('self.reveal(', before)
                  self.assertIn('case .finder: self.reveal(result.outputs)', guarded)
                  self.assertIn('case .card: self.showResultCard(result.outputs)', guarded)
                  # Skipping presentation must not return before queue cleanup/startNextJob.
                  self.assertNotIn('return', completion)
          
          '''
          insert='    '+textwrap.dedent(insert)
          # Keep the reviewed class-method indentation exactly.
          lines=insert.splitlines();insert='\n'.join([lines[0]]+['    '+line if line else '' for line in lines[1:]])+'\n'
          marker='    def test_new_contract_runs_in_mac_ci(self):';assert s.count(marker)==1
          test.write_text(s.replace(marker,insert+marker))
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'output-free';evidence.mkdir()
          red=subprocess.run(['python3','script/test_interface.py'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (evidence/'red.log').write_text(red.stdout)
          assert red.returncode==1 and 'FAIL: test_output_free_success' in red.stdout and 'not found' in red.stdout,red.stdout
          app=pathlib.Path('Sources/Lemulip/AppController.swift');s=app.read_text()
          old='                switch self.completionPresentation {\n                case .quiet: break\n                case .finder: self.reveal(result.outputs)\n                case .card: self.showResultCard(result.outputs)\n                }'
          new='                if !result.outputs.isEmpty {\n                    switch self.completionPresentation {\n                    case .quiet: break\n                    case .finder: self.reveal(result.outputs)\n                    case .card: self.showResultCard(result.outputs)\n                    }\n                }'
          assert s.count(old)==1;app.write_text(s.replace(old,new))
          expected={'Sources/Lemulip/AppController.swift':'efcbb926dc43477886ef89b3e0f61f885e908035','script/test_interface.py':'3c71a65505fb5b19c928d667789bdfac172473db'}
          for path,sha in expected.items():assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          result=subprocess.run([os.environ['RUNNER_TEMP']+'/test-tools/bin/python','-m','unittest','discover','-s','script','-p','test_*.py'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          (evidence/'green.log').write_text(result.stdout);print(result.stdout);assert result.returncode==0
          subprocess.run(['git','diff','--check'],check=True)
          def post(endpoint,payload):
              assert endpoint in ('git/blobs','git/trees')
              request=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/'+endpoint,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps(payload).encode())
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          entries=[]
          for path,sha in expected.items():
              data=pathlib.Path(path).read_bytes();assert post('git/blobs',dict(content=base64.b64encode(data).decode(),encoding='base64'))['sha']==sha
              entries.append(dict(path=path,mode='100644',type='blob',sha=sha))
          tree=post('git/trees',dict(base_tree='f41b74ecabdc6e3c787bf2950f0afd469a1a64c9',tree=entries))['sha']
          (evidence/'source-result.json').write_text(json.dumps(dict(tree=tree,parent='cc85bbf8eafb7be7ce90f136796216ec4a168f87',files=entries),indent=2)+'\n')
          print('Verified native release tree:',tree)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Output-Free-Completion
          path: ${{ runner.temp }}/output-free/
          retention-days: 7
          if-no-files-found: error
