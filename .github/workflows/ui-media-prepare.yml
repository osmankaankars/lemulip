name: Prepare Reviewed Native Media
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-media-prepare.yml]
permissions:
  contents: write
  actions: read
jobs:
  media:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/verify/ui-resume-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Lemulip-Refined-Native-Final
          run-id: 40740281239
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/capture
          digest-mismatch: error
      - name: Prepare isolated encoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m venv "$RUNNER_TEMP/media-tools"
          "$RUNNER_TEMP/media-tools/bin/pip" install Pillow==11.3.0
      - name: Encode only the verified native capture and create unreferenced repository blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/media-tools/bin/python" - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          from PIL import Image
          root=pathlib.Path(os.environ['RUNNER_TEMP']);src=root/'capture';out=root/'reviewed-media';out.mkdir()
          report=json.loads((src/'native-review.json').read_text());assert report['status']=='passed'
          for key in ('realFinderDrag','originalPreserved','resultCardDoesNotStealFocus','noAutomaticClipboardWrite','explicitCopyAndFloat','turkishCompact','pinsSurviveRelaunch','noPersistentFileHistory','threeThemes','contextualSearchAndPins'):assert report[key] is True,key
          commit='f9496dd2c040a3a538bb4fea650355defcb7058d';run=40740281239
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          records=[]
          for target,source in [('app-workspace.webp','workspace-populated.png'),('app-crop-video.webp','editor-video.png'),('app-trim-audio.webp','editor-audio.png'),('app-activity.webp','activity.png')]:
              original=Image.open(src/source).convert('RGBA');w,h=original.size
              image=Image.frombytes('RGBA',original.size,original.tobytes())
              assert all(image.getpixel(p)[3]==0 for p in [(0,0),(w-1,0),(0,h-1),(w-1,h-1)])
              image.save(out/target,'WEBP',quality=93,method=6)
              assert not Image.open(out/target).info.get('exif') and not Image.open(out/target).info.get('icc_profile')
              records.append(dict(file=target,origin='Native app window capture',sourceSHA256=digest(src/source),sourceCommit=commit,sourceWorkflowRun=run,sourceArtifact=12839116953,sourceSize=[w,h],cropBox=[0,0,w,h],capture='Window capture without desktop or shadow',processing='Window-only crop supplied by macOS capture; metadata removed; no UI content generated or repainted',sha256=digest(out/target),width=w,height=h))
          (out/'screenshots.json').write_text(json.dumps(records,indent=2)+'\n')
          movie=out/'finder-conversion.mp4'
          subprocess.run(['ffmpeg','-v','error','-y','-i',str(src/'finder-recording.mov'),'-an','-vf','crop=984:510:24:110','-c:v','libx264','-crf','21','-preset','medium','-pix_fmt','yuv420p','-map_metadata','-1','-movflags','+faststart','-fflags','+bitexact','-flags:v','+bitexact',str(movie)],check=True)
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(movie)],text=True))
          assert len(probe['streams'])==1
          stream=probe['streams'][0];assert stream['codec_name']=='h264' and stream['width']==984 and stream['height']==510
          assert not set(probe['format'].get('tags',{})) & {'creation_time','location','com.apple.quicktime.location.ISO6709'}
          duration=float(probe['format']['duration']);assert 3<duration<30
          still=root/'poster.png'
          subprocess.run(['ffmpeg','-v','error','-y','-ss','6','-i',str(movie),'-frames:v','1',str(still)],check=True)
          image=Image.open(still).convert('RGB');Image.frombytes('RGB',image.size,image.tobytes()).save(out/'finder-conversion.webp','WEBP',quality=92,method=6)
          manifest=dict(file=movie.name,origin='Actual macOS screen recording',sourceCommit=commit,sourceWorkflowRun=run,sourceArtifact=12839116953,sourceSHA256=digest(src/'finder-recording.mov'),sourceSize=[1024,768],cropBox=[24,110,1008,620],width=984,height=510,durationSeconds=duration,audio=False,processing='Desktop edges and system menu cropped; metadata removed. No temporal edits, generated frames or simulated app UI.',sha256=digest(movie),posterSHA256=digest(out/'finder-conversion.webp'))
          (out/'native-recording.json').write_text(json.dumps(manifest,indent=2)+'\n')
          entries=[]
          for p in sorted(out.iterdir()):
              assert p.name in {r['file'] for r in records}|{'screenshots.json','native-recording.json','finder-conversion.mp4','finder-conversion.webp'}
              data=p.read_bytes();assert 0<len(data)<2000000
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs',method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode())
              with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
              assert result['sha']==sha
              entries.append(dict(path='site/assets/'+p.name,sha=sha,sha256=digest(p),size=len(data)))
          (out/'blob-inventory.json').write_text(json.dumps(entries,indent=2)+'\n')
          print(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Reviewed-Native-Media
          path: ${{ runner.temp }}/reviewed-media/
          retention-days: 7
          if-no-files-found: error
