name: Native User Interaction Review

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: native-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  review:
    name: External Production UI (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Sources and Review Staging
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = '${{ matrix.arch }}'
          python3 script/privacy_check.py --staged
          python3 script/test_prepare_native_ui.py
          python3 script/test_pdf_drag_types.py
          python3 script/test_native_ax_bridge.py
          python3 script/test_native_coverage.py
          python3 script/test_native_release_gate.py
          python3 script/test_sound_review_gate.py
      - name: Build the Unchanged Production Application
        env:
          CONFIGURATION: debug
        run: ./script/build_app.sh
      - name: Stage an Isolated Copy and External XCTest Runner
        run: |
          python3 script/prepare_native_ui.py --app dist/Lemulip.app --output "$RUNNER_TEMP/lemulip-native-ui"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lemulip-native-ui'
          suite=root/'Runner/QualityUITests.swift'
          fragment=pathlib.Path('script/native_ui/PDFWorkflowTests.swift').read_bytes()
          # Same-file extension intentionally shares the real-app helpers.
          position=pathlib.Path('script/native_ui/PDFPositionNoopTests.swift').read_bytes()
          options=pathlib.Path('script/native_ui/OptionsParityTests.swift').read_bytes()
          sound=pathlib.Path('script/native_ui/SelectionSoundUITests.swift').read_bytes()
          wheel=pathlib.Path('script/native_ui/WheelNavigationUITests.swift').read_bytes()
          result=pathlib.Path('script/native_ui/PDFResultUITests.swift').read_bytes()
          controls=pathlib.Path('script/native_ui/EditorControlsUITests.swift').read_bytes()
          language=pathlib.Path('script/native_ui/ProductLanguageUITests.swift').read_bytes()
          states=pathlib.Path('script/native_ui/StateAccessibilityUITests.swift').read_bytes()
          finder=pathlib.Path('script/native_ui/FinderDropUITests.swift').read_bytes()
          display=pathlib.Path('script/native_ui/DisplayAccessibilityUITests.swift').read_bytes()
          suite.write_bytes(suite.read_bytes()+fragment+position+options+sound+wheel+result+controls+language+states+finder+display)
          receipt=root/'provenance.json'; record=json.loads(receipt.read_text())
          record['workflowTestSourceSHA256']=hashlib.sha256(fragment).hexdigest()
          record['positionTestSourceSHA256']=hashlib.sha256(position).hexdigest()
          record['optionsParitySourceSHA256']=hashlib.sha256(options).hexdigest()
          record['selectionSoundSourceSHA256']=hashlib.sha256(sound).hexdigest()
          record['wheelNavigationSourceSHA256']=hashlib.sha256(wheel).hexdigest()
          record['pdfResultSourceSHA256']=hashlib.sha256(result).hexdigest()
          record['editorControlsSourceSHA256']=hashlib.sha256(controls).hexdigest()
          record['productLanguageSourceSHA256']=hashlib.sha256(language).hexdigest()
          record['stateAccessibilitySourceSHA256']=hashlib.sha256(states).hexdigest()
          record['finderDropSourceSHA256']=hashlib.sha256(finder).hexdigest()
          record['displayAccessibilitySourceSHA256']=hashlib.sha256(display).hexdigest()
          record['nativeDragReviewSourceSHA256']=hashlib.sha256(pathlib.Path('script/native_ui/NativeDragReview.swift').read_bytes()).hexdigest()
          record['readOnlyAXSourceSHA256']=hashlib.sha256(pathlib.Path('script/native_ui/ReadOnlyAXSnapshot.swift').read_bytes()).hexdigest()
          record['nativeAXBridgeSourceSHA256']=hashlib.sha256(pathlib.Path('script/native_ax_bridge.py').read_bytes()).hexdigest()
          record['compiledTestSourceSHA256']=hashlib.sha256(suite.read_bytes()).hexdigest()
          receipt.write_text(json.dumps(record,indent=2)+'\n')
          PYCODE
      - name: Require Real Media Engine and Decode the Media Fixtures
        env:
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          command -v ffmpeg > "$RUNNER_TEMP/lemulip-native-ui/ffmpeg-path.txt"
          ffmpeg -version > "$RUNNER_TEMP/lemulip-native-ui/ffmpeg-version.txt"
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:duration=0.25' \
            "$RUNNER_TEMP/lemulip-native-ui/Fixtures/Quality.wav"
          ffmpeg -v error -i "$RUNNER_TEMP/lemulip-native-ui/Fixtures/Quality.wav" -f null -
          mkdir "$RUNNER_TEMP/lemulip-native-ui/Fixtures/AudioControls"
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:duration=20' \
            -c:a pcm_s16le "$RUNNER_TEMP/lemulip-native-ui/Fixtures/AudioControls/Playback.wav"
          ffmpeg -v error -i "$RUNNER_TEMP/lemulip-native-ui/Fixtures/AudioControls/Playback.wav" -f null -
          mkdir "$RUNNER_TEMP/lemulip-native-ui/Fixtures/VideoControls"
          ffmpeg -v error -f lavfi -i 'testsrc2=size=320x180:rate=24:duration=20' \
            -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart \
            "$RUNNER_TEMP/lemulip-native-ui/Fixtures/VideoControls/Playback.mp4"
          ffmpeg -v error -i "$RUNNER_TEMP/lemulip-native-ui/Fixtures/VideoControls/Playback.mp4" -f null -
      - name: Build Read-Only Authorized Accessibility Helper
        run: xcrun swiftc -parse-as-library script/native_ui/ReadOnlyAXSnapshot.swift -o "$RUNNER_TEMP/lemulip-native-ui/ReadOnlyAXSnapshot"
      - name: Build In-Flight Finder Drag Observer
        id: native_drag_build
        run: xcrun swiftc -parse-as-library script/native_ui/NativeDragReview.swift -o "$RUNNER_TEMP/lemulip-native-ui/NativeDragReview"
      - name: Exercise Actual Options, Editors, Themes, and Finder Drops
        id: native_tests
        run: |
          set -o pipefail
          python3 script/native_ax_bridge.py --directory "$RUNNER_TEMP/lemulip-native-ui" \
            --helper "$RUNNER_TEMP/lemulip-native-ui/ReadOnlyAXSnapshot" -- \
            xcrun xcodebuild test \
            -project "$RUNNER_TEMP/lemulip-native-ui/Runner/QualityReview.xcodeproj" \
            -scheme QualityReview -destination 'platform=macOS' \
            -xcconfig "$GITHUB_WORKSPACE/script/native_ui/NativeReview.xcconfig" \
            -derivedDataPath "$RUNNER_TEMP/lemulip-native-ui/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/lemulip-native-ui/Results.xcresult" \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/lemulip-native-ui/xcodebuild.log"
      - name: Export Actual Native Review Screenshots
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/lemulip-native-ui/Results.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/lemulip-native-ui/Results.xcresult" \
              --output-path "$RUNNER_TEMP/lemulip-native-ui/ReviewAttachments"
          fi
      - name: Record In-Flight Finder Drag States
        if: ${{ !cancelled() && steps.native_drag_build.outcome == 'success' && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: |
          # Collect this independent diagnostic after a completed XCTest run,
          # including a failed one. A failed native gate remains failed.
          # The observer needs the review app stopped and closes only its own
          # fixture window. The VoiceOver availability probe runs afterward.
          "$RUNNER_TEMP/lemulip-native-ui/NativeDragReview" "$RUNNER_TEMP/lemulip-native-ui"
      - name: Attempt VoiceOver Runtime Review
        if: success()
        run: python3 script/probe_voiceover_review.py --directory "$RUNNER_TEMP/lemulip-native-ui"
      - name: Retain Native Results and Source Provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-External-UI-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/lemulip-native-ui/Results.xcresult
            ${{ runner.temp }}/lemulip-native-ui/provenance.json
            ${{ runner.temp }}/lemulip-native-ui/xcodebuild.log
            ${{ runner.temp }}/lemulip-native-ui/AccessibilitySnapshots
            ${{ runner.temp }}/lemulip-native-ui/DisplayPreferenceSnapshots
            ${{ runner.temp }}/lemulip-native-ui/ffmpeg-path.txt
            ${{ runner.temp }}/lemulip-native-ui/ffmpeg-version.txt
            ${{ runner.temp }}/lemulip-native-ui/ReviewAttachments
            ${{ runner.temp }}/lemulip-native-ui/voiceover-attempt.json
            ${{ runner.temp }}/lemulip-native-ui/VoiceOver-attempt.png
            ${{ runner.temp }}/lemulip-native-ui/NativeDragEvidence
          if-no-files-found: ignore
          retention-days: 14
