name: Apply Reviewed Edge Case
on:
  push:
    branches: [fix/process-and-engine-health-20261027]
    paths: [.github/workflows/apply-reviewed-edge-case.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/fix/process-and-engine-health-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply checksum-verified regression fix
        shell: python
        run: |
          import base64, gzip, hashlib, os, pathlib, subprocess
          temporary='.github/workflows/apply-reviewed-edge-case.yml'
          assert not subprocess.check_output(['git','diff','--name-only','9542c6d4c8e645fbf37ab5d1676735eb2b664d23','HEAD','--','.',':(exclude)'+temporary],text=True).strip()
          encoded=''
          packed=base64.b64decode(encoded,validate=True)
          assert len(packed)==1125 and hashlib.sha256(packed).hexdigest()=='ccc049ba65243a0d44215f12cd882064cbb171346a128a591c98fe1bbc7621d7'
          patch=gzip.decompress(packed)
          assert len(patch)==3646 and hashlib.sha256(patch).hexdigest()=='16958afda9822294a770dc17b051bcfa82aa03bfffe19a030b8df0774e3d9d39'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          env=os.environ.copy(); env['GIT_INDEX_FILE']=str(pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed-index')
          subprocess.run(['git','read-tree',subprocess.check_output(['git','write-tree'],text=True).strip()],env=env,check=True)
          subprocess.run(['git','update-index','--force-remove',temporary],env=env,check=True)
          assert subprocess.check_output(['git','write-tree'],env=env,text=True).strip()=='4294d6c12c0c64d4f17cffea125c00df8ec52013'
      - name: Check and save the isolated branch
        run: |
          python3 script/privacy_check.py --staged
          git diff --cached --check
          git config user.name 'Kaan Kars'
          git config user.email '56635935+osmankaankars@users.noreply.github.com'
          git commit -m 'Keep optional audio codecs from blocking silent video and tighten cancellation tests'
          git push origin HEAD:refs/heads/fix/process-and-engine-health-20261027
