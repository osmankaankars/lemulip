name: Verify Native Bundle Layout
on:
  push:
    branches: [pack/media-engine-20261028]
    paths: [.github/workflows/verify-bundle-layout.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'osmankaankars/lemulip'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8a9de61b2bd2c5d54ad8c4542e8f5cda12d2a107
          persist-credentials: false
      - name: Verify exact patch, test layout and store immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          api='https://api.github.com/repos/osmankaankars/lemulip/git/'
          def call(route,payload=None):
              request=urllib.request.Request(api+route,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          obj=call('blobs/514ec4842da10cb0baee1b79407b4fda9ecbbcd4')
          assert obj['encoding']=='base64'
          packed=base64.b64decode(obj['content'])
          assert len(packed)==5324 and hashlib.sha256(packed).hexdigest()=='58dd8dbe7e043953dd561b38baecc23e342fa15dc6ff8337ee963be3d52af36a'
          decoder=lzma.LZMADecompressor(memlimit=64*1024*1024)
          patch=decoder.decompress(packed,max_length=19167)
          assert decoder.eof and not decoder.unused_data and len(patch)==19166
          assert hashlib.sha256(patch).hexdigest()=='3e71b13fde1f7cd9862ae0beb9f232f889719314e450453cac04b1d06e3d4ed7'
          paths={'.github/workflows/media-engine-pack.yml','Sources/LemulipCore/EngineLocator.swift','Tests/LemulipCoreTests/EngineHealthTests.swift','script/bundle_engines.py','script/test_engine_packs.py'}
          stat=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {row.split('\t',2)[2] for row in stat.splitlines()}==paths
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='63e9f1d0dc0229aa5fe3baf5bcd3c0d18a66fa2b'
          for command in [['python3','script/test_build_media_engine.py'],['python3','script/test_engine_packs.py'],['python3','script/privacy_check.py','--staged'],['git','diff','--cached','--check']]:subprocess.run(command,check=True)
          entries=[]
          for path in sorted(paths):
              raw=pathlib.Path(path).read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              obj=call('blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})
              assert obj['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          print('VERIFIED_SOURCE_OBJECTS '+json.dumps(entries),flush=True)
