name: Refined UI Keyboard And Recording Review
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-native-keyboard-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 16
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f9496dd2c040a3a538bb4fea650355defcb7058d
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Lemulip-macOS-universal
          run-id: 40622450424
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published
          digest-mismatch: error
      - name: Replay reviewed native flows with actual keyboard input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,textwrap,urllib.request
          sha='d84a2c975fc3b534354c35d91ff517430766fd57'
          req=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:raw=base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
          body=textwrap.dedent(raw.decode().split('        run: |\n',1)[1].split('      - name: Require explicit',1)[0])
          unpack='ditto -xk "$RUNNER_TEMP/candidate/Lemulip-Refined-Preview.zip" "$RUNNER_TEMP/native"'
          assert body.count(unpack)==1
          body=body.replace(unpack,'CONFIGURATION=debug ./script/build_app.sh\nditto dist/Lemulip.app "$RUNNER_TEMP/native/Lemulip.app"')
          new='''func writeSearch(_ text: String) throws {
              guard let field = find("workspace.operation-search"), let r = elementFrame(field) else { throw ReviewFailure(message: "Search field missing") }
              application?.activate(); settle(0.15)
              mouse(.mouseMoved, CGPoint(x: r.midX, y: r.midY))
              mouse(.leftMouseDown, CGPoint(x: r.midX, y: r.midY))
              mouse(.leftMouseUp, CGPoint(x: r.midX, y: r.midY)); settle(0.15)
              key(0, flags: .maskCommand); key(51)
              if !text.isEmpty {
                  let chars = Array(text.utf16)
                  for down in [true, false] {
                      let e = CGEvent(keyboardEventSource: nil, virtualKey: 0, keyDown: down)!
                      e.keyboardSetUnicodeString(stringLength: chars.count, unicodeString: chars)
                      e.post(tap: .cghidEventTap)
                  }
              }
              settle(0.5)
          }
          '''
          snippet='import os,pathlib\np=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-review.swift"\ns=p.read_text()\na=s.index("func writeSearch(");b=s.index("func editorReady()",a)\ns=s[:a]+'+repr(new)+'+s[b:]\nassert s.count("settle(1); try resize(1020, 700)")==1\ns=s.replace("settle(1); try resize(1020, 700)",\'try require(waitFor({ mainWindow() != nil }, seconds: 20), "Main window not ready"); try resize(1020, 700)\')\np.write_text(s)\n'
          marker='xcrun swiftc "$RUNNER_TEMP/native-review.swift"'
          assert body.count(marker)==1
          body=body.replace(marker,'python3 - <<\'PATCH\'\n'+snippet+'PATCH\n'+marker)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'native-keyboard-review.sh').write_text(body)
          PY
          status=0
          bash -euo pipefail "$RUNNER_TEMP/native-keyboard-review.sh" || status=$?
          if [ -f "$RUNNER_TEMP/native-review.swift" ]; then cp "$RUNNER_TEMP/native-review.swift" "$RUNNER_TEMP/ui-review/review-probe.swift"; fi
          exit "$status"
      - name: Require explicit acceptance results
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-review'
          r=json.loads((p/'native-review.json').read_text());assert r['status']=='passed',r
          for key in ('realFinderDrag','originalPreserved','resultCardDoesNotStealFocus','noAutomaticClipboardWrite','explicitCopyAndFloat','turkishCompact','pinsSurviveRelaunch','noPersistentFileHistory','threeThemes','contextualSearchAndPins'):assert r[key] is True,key
          assert (p/'finder-recording.mov').stat().st_size>10000
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-UI-Keyboard-Review
          path: ${{ runner.temp }}/ui-review/
          retention-days: 7
          if-no-files-found: error
