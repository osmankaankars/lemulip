name: Native Note-Only Completion Acceptance
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-word-count-final.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d37620cc24735a056ed473eb343565650d9e5548
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Lemulip-Refined-Native-Final
          run-id: 40740281239
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-proof
          digest-mismatch: error
      - name: Build the exact release head
        run: CONFIGURATION=debug ./script/build_app.sh
      - name: Exercise Word Count twice with Finder and card preferences
        run: |
          mkdir -p "$RUNNER_TEMP/word-count-review"
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          data=(root/'previous-proof/review-probe.swift').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='ee8846f37fc0e60bda3605d1bfa46098e8c61f25d418f5db8185a7d35936e8d9'
          code=data.decode();assert code.count('let recorder = Recorder()')==1
          (root/'word-count.swift').write_text(code.split('let recorder = Recorder()',1)[0])
          PY
          cat >> "$RUNNER_TEMP/word-count.swift" <<'SWIFT'
          do {
              try require(AXIsProcessTrusted() && CGPreflightPostEventAccess(), "Existing UI permission unavailable")
              try FileManager.default.createDirectory(at: fixtures, withIntermediateDirectories: true)
              let source = fixtures.appendingPathComponent("word-count.txt")
              let original = Data("one two three four".utf8)
              try original.write(to: source, options: .withoutOverwriting)
              let config = NSWorkspace.OpenConfiguration(); config.createsNewApplicationInstance = true
              var launched = false
              NSWorkspace.shared.openApplication(at: appURL, configuration: config) { app, _ in application = app; launched = true }
              try require(waitFor({ launched && application != nil }, seconds: 20), "Application did not launch")
              root = AXUIElementCreateApplication(application!.processIdentifier)
              AXUIElementSetMessagingTimeout(root!, 1)
              try require(waitFor({ mainWindow() != nil }, seconds: 20), "Workspace not ready")
              try openFile("word-count.txt")
              for count in 1...2 {
                  phase = "word-count-" + String(count)
                  try press("navigation.workspace")
                  try writeSearch("word count")
                  try require(waitFor({ find("operation.document.wordCount") != nil }), "Word Count not available")
                  try press("operation.document.wordCount")
                  try require(!containsText("The Output File Is No Longer Available"), "Successful Word Count showed a missing-file alert")
                  try press("navigation.activity")
                  try require(waitFor({ containsText("4 words") && containsText(String(count) + " Completed") }), "Note-only result or queue continuation missing")
                  try require(!containsText("The Output File Is No Longer Available"), "Note-only completion showed an error")
                  try require(!windows().contains { abs((bounds($0)?.width ?? 0) - 396) < 2 }, "Note-only operation opened an empty result card")
              }
              try require(try Data(contentsOf: source) == original, "Original note changed")
              try require(try FileManager.default.contentsOfDirectory(atPath: fixtures.path) == ["word-count.txt"], "Unexpected output file")
              if CGPreflightScreenCaptureAccess() { try capture("word-count-" + CommandLine.arguments[4]) }
              report["status"] = "passed"; report["originalPreserved"] = true
              report["twoCompletedWithoutAlert"] = true; report["queueContinues"] = true
              report["noOutputFileOrEmptyCard"] = true; report["preference"] = CommandLine.arguments[4]
          } catch let error as ReviewFailure { report["status"] = "failed"; report["reason"] = error.message; report["phase"] = phase }
          catch { report["status"] = "failed"; report["reason"] = "Native regression probe failed"; report["phase"] = phase }
          application?.terminate(); _ = waitFor({ application?.isTerminated ?? true }, seconds: 10)
          let data = try JSONSerialization.data(withJSONObject: report, options: [.prettyPrinted, .sortedKeys])
          try data.write(to: output.appendingPathComponent("word-count-" + CommandLine.arguments[4] + ".json"))
          print(String(data: data, encoding: .utf8)!)
          if report["status"] as? String != "passed" { exit(1) }
          SWIFT
          cp "$RUNNER_TEMP/word-count.swift" "$RUNNER_TEMP/word-count-review/probe.swift"
          xcrun swiftc "$RUNNER_TEMP/word-count.swift" -o "$RUNNER_TEMP/word-count"
          for mode in finder card; do
            defaults write app.freewheel.Freewheel language -string en
            defaults write app.freewheel.Freewheel completionPresentation -string "$mode"
            "$RUNNER_TEMP/word-count" "$PWD/dist/Lemulip.app" "$RUNNER_TEMP/word-count-review" "$RUNNER_TEMP/word-fixture-$mode" "$mode"
          done
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Native-Word-Count-Final
          path: ${{ runner.temp }}/word-count-review/
          retention-days: 7
          if-no-files-found: error
