name: Website and Interactive Demo

on:
  push:
    branches: [main]
    paths: ['site/**', 'Resources/AppIcon.png', '.github/workflows/pages.yml', 'script/prepare_site.py', 'script/test_prepare_site.py', 'script/privacy_check.py']
  pull_request:
    paths: ['site/**', 'Resources/AppIcon.png', '.github/workflows/pages.yml', 'script/prepare_site.py', 'script/test_prepare_site.py', 'script/privacy_check.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare Static Site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Public Source Contents
        run: |
          python3 script/privacy_check.py --staged
          python3 script/test_prepare_site.py
          test -s site/index.html
          test -z "$(find site -type l -print -quit)"
      - name: Read Pages Configuration
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare Deployment and Share Image
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$SITE_EVENT" = pull_request ]; then
            # PRs prepare the same metadata against a non-publishing fixture URL.
            PAGES_URL='https://preview.example.invalid/lemulip'
          fi
          python3 script/prepare_site.py \
            --destination "$RUNNER_TEMP/lemulip-pages" \
            --repository "$SITE_REPOSITORY" \
            --pages-url "$PAGES_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/lemulip-pages

  deploy:
    name: Deploy Website
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
