name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Match the full Xcode toolchain used for the first successful native build.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: freewheel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: macOS tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public source contents
        run: python3 script/privacy_check.py --staged
      - name: Check architecture, toolchain, and version
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcode-select --print-path
          xcrun --sdk macosx swift --version
          xcrun --sdk macosx swift package dump-package > /dev/null
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REF_TYPE" == tag ]]; then test "$REF_NAME" = "v$VERSION"; fi
      - name: Compile and test built-in engines
        run: xcrun --sdk macosx swift test --jobs 2 --skip EngineIntegrationTests
      - name: Install test codecs
        if: matrix.arch == 'arm64'
        env:
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install ffmpeg imagemagick
          brew install --cask libreoffice
      - name: Install official Pandoc with embedded templates
        if: matrix.arch == 'arm64'
        run: ./script/install_ci_pandoc.sh
      - name: Require all integration engines
        if: matrix.arch == 'arm64'
        run: |
          command -v ffprobe
          ENGINES=$(xcrun --sdk macosx swift run --skip-build freewheel engines)
          printf '%s\n' "$ENGINES"
          if [[ "$ENGINES" == *"not installed"* ]]; then exit 1; fi
      - name: Test external engine integrations
        if: matrix.arch == 'arm64'
        run: xcrun --sdk macosx swift test --jobs 2 --filter EngineIntegrationTests

  package:
    name: Universal macOS package
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build universal release once
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./script/package_release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Freewheel-macOS-universal
          path: |
            dist/Freewheel-*-macOS-universal.zip
            dist/Freewheel-*-macOS-universal.dmg
            dist/Freewheel-*-Source.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify-package:
    name: Verify release download (${{ matrix.arch }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Freewheel-macOS-universal
          path: dist
          digest-mismatch: error
      - name: Verify the exact archives that will be published
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          ./script/package_release.sh --verify dist

  release:
    name: Publish tagged release
    needs: [package, verify-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Freewheel-macOS-universal
          path: dist
          digest-mismatch: error
      - name: Publish verified preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          cd dist
          sha256sum --check --strict SHA256SUMS.txt
          python3 - <<'PY'
          import os, pathlib, posixpath, re
          from urllib.parse import quote, urlsplit
          repo, tag = os.environ['RELEASE_REPO'], os.environ['RELEASE_TAG']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+', repo):
              raise SystemExit('Invalid release repository')
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Invalid release tag')
          def tagged_link(match):
              target = urlsplit(match[1])
              if target.scheme or target.netloc or target.path.startswith('/'):
                  return match[0]
              path = posixpath.normpath('docs/' + target.path)
              if path.startswith('../'): raise SystemExit('Invalid relative documentation link')
              fragment = '#' + quote(target.fragment, safe='-_.') if target.fragment else ''
              return '](' + f'https://github.com/{repo}/blob/{tag}/' + quote(path, safe='/') + fragment + ')'
          notes = pathlib.Path('RELEASE_NOTES.md').read_text()
          notes = re.sub(r'\]\(([^()\s]+\.md(?:#[^()\s]*)?)\)', tagged_link, notes)
          pathlib.Path('PUBLIC_RELEASE_NOTES.md').write_text(notes)
          PY
          gh release create "$RELEASE_TAG" \
            "Freewheel-$RELEASE_VERSION-macOS-universal.zip" \
            "Freewheel-$RELEASE_VERSION-macOS-universal.dmg" \
            "Freewheel-$RELEASE_VERSION-Source.zip" SHA256SUMS.txt \
            --verify-tag --repo "$RELEASE_REPO" \
            --title "Freewheel $RELEASE_TAG · Public preview" \
            --prerelease --latest=false --notes-file PUBLIC_RELEASE_NOTES.md
