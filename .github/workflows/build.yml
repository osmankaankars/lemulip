name: Build and Verify

on:
  push:
    branches: [main, 'pack/image-engine-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pin the full developer toolchain for reproducible macOS builds.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: lemulip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source-snapshot:
    name: Retain Checked Source for This Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check and Package Exact Public Sources
        run: |
          python3 script/privacy_check.py --staged
          mkdir "$RUNNER_TEMP/checked-source"
          python3 script/package_source.py --output "$RUNNER_TEMP/checked-source/Lemulip-Candidate-Source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/checked-source/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/checked-source/source-tree.txt"
          cd "$RUNNER_TEMP/checked-source"
          sha256sum Lemulip-Candidate-Source.zip source-commit.txt source-tree.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Candidate-Source-${{ github.run_id }}
          path: ${{ runner.temp }}/checked-source
          if-no-files-found: error
          retention-days: 14

  native-ui:
    name: Native UI Gate
    uses: ./.github/workflows/native-ui-review.yml

  review-copy:
    name: Current Unreleased Review Copy
    needs: [test, native-ui]
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'fix/quality-020-followup-20261031' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/current-ui-review.yml

  test:
    name: macOS Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Public Source Contents
        run: python3 script/privacy_check.py --staged
      - name: Validate Engine Pack Guardrails
        run: |
          python3 script/test_engine_packs.py
          python3 script/test_release_engines.py
          python3 script/test_publish_preview.py
          python3 script/test_interface.py
          python3 script/test_native_coverage.py
          python3 script/test_native_release_gate.py
          python3 script/test_sound_review_gate.py
      - name: Check Architecture, Toolchain, and Version
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcode-select --print-path
          xcrun --sdk macosx swift --version
          xcrun --sdk macosx swift package dump-package > /dev/null
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REF_TYPE" == tag ]]; then test "$REF_NAME" = "v$VERSION"; fi
      - name: Compile Source and Native Test Targets
        id: compile
        run: xcrun --sdk macosx swift build --build-tests --jobs 2
      - name: Test Built-In Engines and Models
        env:
          LEMULIP_EDITOR_REVIEW_DIR: ${{ runner.temp }}/lemulip-editor-review
        run: |
          export LEMULIP_EDITOR_REVIEW_COMMIT="$(git rev-parse HEAD)"
          xcrun --sdk macosx swift test --skip-build --skip 'EngineIntegrationTests|PDFEditorInteractionTests|SelectionFeedbackTests|OperationOptionsAccessibilityTests|PDFRangeInteractionTests'
      # Exact option semantics and pointer workflows are checked by the required
      # real-app native-ui job; legacy synthetic diagnostics remain manual.
      # Each remaining hosted review gets its own AppKit process. A failed sibling must
      # not hide later evidence; every failed step still fails the whole job.
      - name: Review PDF Editor Keyboard Interactions
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          LEMULIP_PDF_REVIEW_DIR: ${{ runner.temp }}/lemulip-pdf-review
        run: |
          export LEMULIP_PDF_REVIEW_COMMIT="$(git rev-parse HEAD)"
          xcrun --sdk macosx swift test --skip-build --filter PDFEditorInteractionTests
      - name: Review Selection Feedback and Editor Continuity
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          LEMULIP_SELECTION_REVIEW_DIR: ${{ runner.temp }}/lemulip-selection-review
          LEMULIP_EDITOR_REVIEW_DIR: ${{ runner.temp }}/lemulip-editor-review
        run: |
          export LEMULIP_SELECTION_REVIEW_COMMIT="$(git rev-parse HEAD)"
          export LEMULIP_EDITOR_REVIEW_COMMIT="$(git rev-parse HEAD)"
          xcrun --sdk macosx swift test --skip-build --filter SelectionFeedbackTests
      - name: Review PDF Page Range Correction
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          LEMULIP_RANGE_REVIEW_DIR: ${{ runner.temp }}/lemulip-range-review
        run: |
          export LEMULIP_RANGE_REVIEW_COMMIT="$(git rev-parse HEAD)"
          xcrun --sdk macosx swift test --skip-build --filter PDFRangeInteractionTests
      - name: Retain PDF Interaction Review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-PDF-Interaction-${{ matrix.arch }}
          path: ${{ runner.temp }}/lemulip-pdf-review
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain Editor Continuity Review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Editor-Review-${{ matrix.arch }}
          path: ${{ runner.temp }}/lemulip-editor-review
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain Selection Sound Audition
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Selection-Sound-${{ matrix.arch }}
          path: ${{ runner.temp }}/lemulip-selection-review
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain PDF Range Review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-PDF-Range-${{ matrix.arch }}
          path: ${{ runner.temp }}/lemulip-range-review
          if-no-files-found: ignore
          retention-days: 14
      - name: Install Test Codecs
        if: matrix.arch == 'arm64'
        env:
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # Runner images may retain a cask version removed from the upstream stable directory.
          brew update
          brew install ffmpeg imagemagick
          brew install --cask libreoffice
      - name: Install Official Pandoc With Embedded Templates
        run: ./script/install_ci_pandoc.sh
      - name: Verify Commandless Document Engine Installation
        run: |
          set -o pipefail
          xcrun --sdk macosx swift test --jobs 2 --filter EngineIntegrationTests/testOfficialPandocCommandlessInstallAndNoOverwrite 2>&1 | tee "$RUNNER_TEMP/engine-installation.log"
      - name: Retain Installation Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Engine-Installation-${{ matrix.arch }}
          path: ${{ runner.temp }}/engine-installation.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Require All Integration Engines
        if: matrix.arch == 'arm64'
        run: |
          command -v ffprobe
          ENGINES=$(xcrun --sdk macosx swift run --skip-build lemulip engines)
          printf '%s\n' "$ENGINES"
          if [[ "$ENGINES" == *"not installed"* ]]; then exit 1; fi
      - name: Test External Engine Integrations
        if: matrix.arch == 'arm64'
        env:
          LEMULIP_OFFICE_REVIEW_DIR: ${{ runner.temp }}/lemulip-office-review
        run: |
          mkdir -m 700 "$LEMULIP_OFFICE_REVIEW_DIR"
          git rev-parse HEAD > "$LEMULIP_OFFICE_REVIEW_DIR/source-commit.txt"
          set -o pipefail
          xcrun --sdk macosx swift test --jobs 2 --filter EngineIntegrationTests 2>&1 | tee "$RUNNER_TEMP/engine-integration.log"
          python3 script/prepare_office_review.py "$LEMULIP_OFFICE_REVIEW_DIR" --output "$RUNNER_TEMP/Lemulip-Office-Review.zip"
      - name: Retain Integration Diagnostics
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Engine-Integration-Log
          path: ${{ runner.temp }}/engine-integration.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Office Review Examples
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lemulip-Office-Review-arm64
          path: ${{ runner.temp }}/Lemulip-Office-Review.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  native-engines:
    name: Bundled Engines (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Engine Recipes And Native Architecture
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python3 script/test_build_media_engine.py
          python3 script/test_build_image_engine.py
          python3 script/test_release_engines.py
      - name: Install Build Tools Only
        env:
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: ./script/install_ci_build_tools.sh
      - name: Build And Verify Both Native Engines
        run: |
          set -o pipefail
          python3 script/build_media_engine.py --arch '${{ matrix.arch }}' --work "$RUNNER_TEMP/media-build" --output "$RUNNER_TEMP/native-packs/ffmpeg" 2>&1 | tee "$RUNNER_TEMP/media-build.log"
          python3 script/build_image_engine.py --arch '${{ matrix.arch }}' --work "$RUNNER_TEMP/image-build" --output "$RUNNER_TEMP/native-packs/imagemagick" 2>&1 | tee "$RUNNER_TEMP/image-build.log"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'native-artifact';out.mkdir()
          files={}
          for name in ('ffmpeg','imagemagick'):
              archive=out/(name+'.tar.gz')
              with tarfile.open(archive,'w:gz') as tar:tar.add(root/'native-packs'/name,arcname=name)
              files[archive.name]=hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()
          (out/'build.json').write_text(json.dumps({'schema':1,'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'architecture':platform.machine(),'files':files},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Native-Engines-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain Engine Diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/engine-diagnostics"
          python3 - <<'PY'
          import os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'engine-diagnostics'
          for name in ('media-build','image-build'):
              base=root/name
              for source in base.rglob('config.log'):
                  target=out/name/source.relative_to(base);target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,target)
              for name2 in ('smoke','relocated-smoke'):
                  for filename in ('result.json','formats.txt'):
                      source=base/name2/filename
                      if source.is_file():
                          target=out/name/name2/filename;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,target)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Native-Engine-Logs-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/media-build.log
            ${{ runner.temp }}/image-build.log
            ${{ runner.temp }}/engine-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Universal macOS Package
    needs: [test, native-engines, native-ui]
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Release Version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: Lemulip-Native-Engines-*
          path: ${{ runner.temp }}/native-artifacts
          digest-mismatch: error
      - name: Merge Verified Native Engines Into Universal Packs
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess,sys
          sys.path.insert(0,'script')
          from build_media_engine import extract_source
          from merge_engine_packs import merge
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          sources={}
          for arch in ('arm64','x86_64'):
              folder=root/'native-artifacts'/('Lemulip-Native-Engines-'+arch)
              record=json.loads((folder/'build.json').read_text())
              assert record['schema']==1 and record['commit']==head and record['architecture']==arch
              assert set(record['files'])=={'ffmpeg.tar.gz','imagemagick.tar.gz'}
              for engine in ('ffmpeg','imagemagick'):
                  archive=folder/(engine+'.tar.gz')
                  assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==record['files'][archive.name]
                  sources[arch,engine]=extract_source(archive,root/'native-extracted'/arch/engine)
          for engine in ('ffmpeg','imagemagick'):
              merge(sources['arm64',engine],sources['x86_64',engine],root/'universal-engines'/engine)
          PYCODE
      - name: Build Universal Release Once
        env:
          LEMULIP_ENGINE_PACKS: ${{ runner.temp }}/universal-engines
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./script/package_release.sh
      - name: Retain Matching GUI And CLI Debug Symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lemulip-GUI-CLI-Debug-Symbols
          path: dist/Lemulip-Debug-Symbols/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lemulip-macOS-universal
          path: |
            dist/Lemulip-*-macOS-universal.zip
            dist/Lemulip-*-macOS-universal.dmg
            dist/Lemulip-*-Source.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify-package:
    name: Verify Release Download (${{ matrix.arch }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lemulip-macOS-universal
          path: dist
          digest-mismatch: error
      - name: Verify the Exact Archives That Will Be Published
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          ./script/package_release.sh --verify dist

  release:
    name: Publish Tagged Release
    needs: [package, verify-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lemulip-macOS-universal
          path: dist
          digest-mismatch: error
      - name: Publish Verified Preview Downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: python3 script/publish_release.py
