name: Native Retained Trace Export

on:
  push:
    branches: ['codex/retained-trace-export-07']
    paths:
      - '.github/workflows/native-retained-trace-export.yml'
      - 'script/native_retained_trace_command.py'
      - 'script/native_retained_trace_input.py'
      - 'script/native_retained_trace_toc.py'
      - 'script/run_native_retained_trace_export.py'
      - 'script/test_native_retained_trace_command.py'
      - 'script/test_native_retained_trace_input.py'
      - 'script/test_native_retained_trace_toc.py'
      - 'script/test_run_native_retained_trace_export.py'

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  D25_BASE: ee4ceaecee43d7f982e0523a52236799b5f2a603

concurrency:
  group: native-retained-trace-export-${{ github.ref }}
  cancel-in-progress: false

# One reader on the original architecture; never records, imports or repairs.
jobs:
  retained-export:
    name: Retained Intel Trace TOC
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Check Out Exact Diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python With Nonreaping Child Status
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind Source And Run Portable Gates
        run: |
          mkdir -p "$RUNNER_TEMP/retained-trace-export/preflight"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/retained-trace-export/preflight/experiment-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/retained-trace-export/preflight/experiment-tree.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(uname -m)" = x86_64
          git merge-base --is-ancestor "$D25_BASE" HEAD
          python3 - <<'PYCODE'
          import os, subprocess, sys
          sys.path.insert(0, 'script')
          from run_native_retained_trace_export import NEW_PATHS
          assert sys.version_info >= (3, 13)
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['D25_BASE'], 'HEAD'], text=True).splitlines()
          assert set(changed) <= set(NEW_PATHS), changed
          assert subprocess.check_output(['git', 'rev-parse', 'd821d7343675e2850705d141ef9b3b93a6aee945^{tree}'], text=True).strip() == '425baa28f00ec24551dd70c0cc874a75fa3be0c1'
          PYCODE
          for suite in collect_native_trace_capabilities run_native_system_trace_startup native_retained_trace_input native_retained_trace_toc native_retained_trace_command run_native_retained_trace_export; do
            python3 "script/test_${suite}.py" -v > "$RUNNER_TEMP/retained-trace-export/preflight/${suite}.stdout.txt" 2> "$RUNNER_TEMP/retained-trace-export/preflight/${suite}.stderr.txt"
          done
          # D25 reuses these D24 primitives, not its helper/recorder/sampler orchestration.
          # The full D24 R1 failure remains recorded; these tests do not reclassify it.
          python3 script/test_run_native_recorder_progress_observation.py -v \
            OwnedCommandTests NonreapingCapabilityTests BoundedFileTests InstalledToolIdentityTests \
            > "$RUNNER_TEMP/retained-trace-export/preflight/d24-used-primitives.stdout.txt" \
            2> "$RUNNER_TEMP/retained-trace-export/preflight/d24-used-primitives.stderr.txt"
          python3 script/privacy_check.py --staged > "$RUNNER_TEMP/retained-trace-export/preflight/privacy.txt"
      - name: Fetch Exact Existing Intel Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/curl --version > "$RUNNER_TEMP/retained-trace-export/preflight/curl-version.txt"
          python3 - <<'PYCODE'
          import os, pathlib, re
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'retained-trace-export/preflight/curl-version.txt').read_text()
          version = re.match(r'curl (\d+)\.(\d+)\.(\d+)\b', text)
          assert version and tuple(map(int, version.groups())) >= (8, 4, 0), 'Require curl with an in-transfer download-size limit'
          PYCODE
          /usr/bin/curl --fail --silent --show-error --location --max-redirs 3 \
            --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 \
            --max-filesize 12948337 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/retained-trace-export/D24-R2-x86_64.zip" \
            'https://api.github.com/repos/osmankaankars/lemulip/actions/artifacts/13669502448/zip' \
            2> "$RUNNER_TEMP/retained-trace-export/preflight/artifact-download.stderr.txt"
      - name: Export The Retained Trace TOC Once
        run: |
          python3 script/run_native_retained_trace_export.py \
            --artifact-zip "$RUNNER_TEMP/retained-trace-export/D24-R2-x86_64.zip" \
            --output "$RUNNER_TEMP/retained-trace-export/evidence" \
            --experiment-commit "$GITHUB_SHA"
      - name: Verify Worktree Preservation
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Collect Portable Gate Evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/retained-trace-export/evidence/build"
          cp -R "$RUNNER_TEMP/retained-trace-export/preflight/." "$RUNNER_TEMP/retained-trace-export/evidence/build/"
      - name: Retain Export Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-retained-trace-export-x86_64
          path: ${{ runner.temp }}/retained-trace-export/evidence/
          if-no-files-found: error
          retention-days: 14
