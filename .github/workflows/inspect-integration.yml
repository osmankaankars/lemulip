name: Inspect Native Integration
on:
  push:
    branches: [feat/engine-packs-and-activity-20261027]
    paths: [.github/workflows/inspect-integration.yml]
permissions:
  contents: read
  checks: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read failed check annotations
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/osmankaankars/lemulip/check-runs/121932917844/annotations?per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:
              annotations=json.load(response)
          for item in annotations:
              if item['annotation_level']=='failure':
                  print(json.dumps({key:item.get(key) for key in ['path','start_line','title','message','raw_details']}))
