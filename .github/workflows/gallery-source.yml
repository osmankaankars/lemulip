name: Gallery Source Snapshot
on:
  push:
    branches: [site/native-gallery-20261022]
    paths: [.github/workflows/gallery-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 603c6973a46524c3e4eabeef6b0b32c7dba62815
          persist-credentials: false
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/gallery-source.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Gallery-Source
          path: ${{ runner.temp }}/gallery-source.tar.gz
          retention-days: 1
