name: Refined Native UI Final Acceptance
on:
  push:
    branches: [verify/ui-resume-20261028]
    paths: [.github/workflows/ui-native-final.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 162488f18d6248f27268e929b0ea2759c025efbf
          persist-credentials: false
      - name: Download the unchanged public engine donor
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 30 --max-time 180 --max-filesize 153096832 'https://github.com/osmankaankars/lemulip/releases/download/v0.1.17/Lemulip-0.1.17-macOS-universal.zip' -o "$RUNNER_TEMP/published/Lemulip-0.1.17-macOS-universal.zip"
      - name: Run the exact accepted probe with its corrected output expectation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,textwrap
          source=pathlib.Path('.github/workflows/ui-native-acceptance.yml').read_text()
          body=source.split('      - name: Review the unmodified application with real inputs\n',1)[1].split('        run: |\n',1)[1].split('      - name: Require every',1)[0]
          assert body.count('focus-check-converted.webm')==1
          body=body.replace('focus-check-converted.webm','focus-check.webm')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'final-native.sh').write_text(textwrap.dedent(body))
          PY
          bash -euo pipefail "$RUNNER_TEMP/final-native.sh"
      - name: Require every acceptance result
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-review'
          r=json.loads((p/'native-review.json').read_text());assert r['status']=='passed',r
          for key in ('realFinderDrag','originalPreserved','resultCardDoesNotStealFocus','noAutomaticClipboardWrite','explicitCopyAndFloat','turkishCompact','pinsSurviveRelaunch','noPersistentFileHistory','threeThemes','contextualSearchAndPins'):assert r[key] is True,key
          assert (p/'finder-recording.mov').stat().st_size>10000
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Refined-Native-Final
          path: ${{ runner.temp }}/ui-review/
          retention-days: 7
          if-no-files-found: error
