name: Verify Published Native Retry Once
on:
  push:
    branches: [verify/native-ui-20261028]
    paths: [.github/workflows/native-retry-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c8a939cdba4532134a43326b36a39ef6d09ae4a0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Lemulip-macOS-universal
          run-id: 40622450424
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published
          digest-mismatch: error
      - name: Exercise Native Retry With An Invalid Then Repaired Test Image
        run: |
          mkdir -p "$RUNNER_TEMP/retry-review"
          python3 - <<'PY'
          import hashlib,os,pathlib,textwrap
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=root/'published/Lemulip-0.1.17-macOS-universal.zip'
          assert archive.stat().st_size==153096832
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()=='a48b8d36a606a85398dded5019326287218c8478fa479751ff4ad0e3a5d852d4'
          workflow=pathlib.Path('.github/workflows/native-conversion-once.yml').read_text()
          source=textwrap.dedent(workflow.split('<<\'SWIFT\'\n',1)[1].split('\n          SWIFT\n',1)[0])
          old='let clicked = press(root,"WEBP")'
          assert source.count(old)==1
          new='''try Data("deliberately invalid disposable test image".utf8).write(to:source)
          let clicked = press(root,"WEBP")
          _ = press(root,"Activity")
          let failureDeadline = Date().addingTimeInterval(20)
          while !text(root).contains("Retry") && Date() < failureDeadline && clicked { settle(0.2) }
          let failureShown = text(root).contains("Retry")
          let noPrematureOutput = !FileManager.default.fileExists(atPath:fixtures.appendingPathComponent("native-ui-sample.webp").path)
          report["expectedFailureShown"] = failureShown
          report["noOutputOnFailure"] = noPrematureOutput
          try original.write(to:source)
          let retried = press(root,"Retry")
          report["retryPressed"] = retried
          checks.append(["name":"Failed Conversion Can Be Retried","status":failureShown && noPrematureOutput && retried ? "passed":"failed"])
          '''
          source=source.replace(old,new)
          source=source.replace('PNG To WebP Through Native Button','PNG To WebP After Native Retry')
          source=source.replace('conversion-review.json','retry-review.json')
          (root/'retry-probe.swift').write_text(source)
          PY
          ditto -xk "$RUNNER_TEMP/published/Lemulip-0.1.17-macOS-universal.zip" "$RUNNER_TEMP/native-app"
          xcrun swiftc "$RUNNER_TEMP/retry-probe.swift" -o "$RUNNER_TEMP/retry-probe"
          "$RUNNER_TEMP/retry-probe" "$RUNNER_TEMP/native-app/Lemulip-0.1.17-macOS-universal/Lemulip.app" "$RUNNER_TEMP/retry-review"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Lemulip-Native-Retry-Review
          path: ${{ runner.temp }}/retry-review/
          retention-days: 7
          if-no-files-found: error
