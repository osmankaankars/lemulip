name: Validate Refresh Transfer
on:
  push:
    branches: [refresh/lemulip-2026-10-21]
    paths: ['.github/refresh-payload/**', '.github/workflows/repository-refresh.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/refresh/lemulip-2026-10-21'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect archive as data only
        shell: python
        run: |
          import hashlib, io, pathlib, tarfile
          parts = sorted(pathlib.Path('.github/refresh-payload').glob('part-*'))
          data = b''.join(p.read_bytes() for p in parts)
          print('ARCHIVE_SHA256', hashlib.sha256(data).hexdigest(), 'BYTES', len(data), flush=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit('Unexpected archive entry: ' + member.name)
                  if member.size > 2000000:
                      raise SystemExit('Oversized entry: ' + member.name)
                  raw = archive.extractfile(member).read()
                  print('FILE', member.name, 'BYTES', len(raw), 'SHA256', hashlib.sha256(raw).hexdigest(), flush=True)
              for member in members:
                  if member.name.endswith(('.md', '.yml', '.py', '.html', '.js', '.css', '.svg', '.json')):
                      raw = archive.extractfile(member).read()
                      print('\nBEGIN_FILE ' + member.name + '\n' + raw.decode('utf-8') + '\nEND_FILE ' + member.name, flush=True)
