name: Validate Refresh Transfer
on:
  push:
    branches: [refresh/lemulip-2026-10-21]
    paths: ['.github/workflows/repository-refresh.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/refresh/lemulip-2026-10-21'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive committed source without executing project code
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/lemulip-maintenance-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/lemulip-maintenance-source.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lemulip-maintenance-source
          path: ${{ runner.temp }}/lemulip-maintenance-source.tar.gz
          retention-days: 1
          if-no-files-found: error
