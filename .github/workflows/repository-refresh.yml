name: Validate Refresh Transfer
on:
  push:
    branches: [refresh/lemulip-2026-10-21]
    paths: ['.github/refresh-payload/**', '.github/workflows/repository-refresh.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'osmankaankars/lemulip' && github.ref == 'refs/heads/refresh/lemulip-2026-10-21'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: refresh-transfer-validation
          path: .github/refresh-payload/
          include-hidden-files: true
          retention-days: 1
      - name: Show transfer checksums without executing payload
        run: sha256sum .github/refresh-payload/part-*
