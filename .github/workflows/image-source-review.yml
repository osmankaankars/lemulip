name: Export Image Engine Base
on:
  push:
    branches: [pack/image-engine-20261028]
    paths: [.github/workflows/image-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 428fb5c3532a5c7e46c1291ddf0714522d3b055e
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/image-base.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Lemulip-Image-Base
          path: ${{ runner.temp }}/image-base.tar.gz
          retention-days: 1
