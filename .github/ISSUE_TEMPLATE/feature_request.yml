name: Feature Request
description: Suggest a useful workflow, format, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What Are You Trying to Do?
      description: Describe a concrete file task and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed Behavior
      description: Include a non-sensitive example and any format or quality requirements.
    validations:
      required: true
